function fmtAns(v){ return (Math.round(v*10000)/10000).toString(); }
function renderNum(b, ctx){
  const sh = qShell(b, b.label || 'Your answer');
  const inp = el('input',{type:'text', inputmode:'decimal', autocomplete:'off', 'aria-label':'Answer', placeholder:'number'});
  const btn = el('button',{class:'btn btn-primary btn-sm'},'Check');
  const fb = el('div',{class:'feedback','aria-live':'polite'});
  let tries = 0;
  function finish(val, revealed){
    inp.value = val; inp.disabled = true; btn.disabled = true; sh.markDone();
    fb.className = revealed ? 'feedback info' : 'feedback ok';
    fb.innerHTML = revealed ? ('The expected answer is <b>' + fmtAns(b.answer) + ' ' + (b.unit||'') + '</b>. ' + (b.explain||'') + (b.revealNote? ' ' + b.revealNote : ''))
                            : ('<b>Correct!</b> ' + (b.explain||''));
  }
  function check(){
    if(sh.q.classList.contains('is-done')) return;
    const v = parseNum(inp.value, b.unit);
    if(isNaN(v)){ fb.className='feedback info'; fb.innerHTML='Type a number first (you can leave off the units).'; return; }
    const tol = Math.max(b.abs||0, Math.abs(b.answer)*(b.tol==null?0.05:b.tol));
    if(Math.abs(v - b.answer) <= tol + 1e-9){ finish(inp.value, false); putItem(ctx.pid, b.id, {done:true, val:inp.value}); ctx.refresh && ctx.refresh(); return; }
    tries++;
    if(tries >= (b.maxTries||3)){ finish(inp.value, true); putItem(ctx.pid, b.id, {done:true, val:inp.value, revealed:true}); ctx.refresh && ctx.refresh(); return; }
    inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'), 400);
    fb.className='feedback bad'; fb.innerHTML = '<b>Not quite.</b> ' + (tries===1 ? (b.hint || 'Check your work and try again.') : (b.hint2 || b.hint || 'Look carefully and try once more.')) + ' <span class="small">(Try ' + (tries+1) + ' of ' + (b.maxTries||3) + ')</span>';
  }
  btn.addEventListener('click', check);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
  sh.q.appendChild(el('div',{class:'num-row'}, inp, b.unit? el('span',{class:'unit'}, b.unit):null, btn));
  sh.q.appendChild(fb);
  const saved = getItem(ctx.pid, b.id);
  if(saved && saved.done) finish(saved.val||'', !!saved.revealed);
  return sh.q;
}

function pickQuestions(pool, n){
  const groups = {}; pool.forEach(q=>{ (groups[q.topic] = groups[q.topic] || []).push(q); });
  const keys = shuffle(Object.keys(groups)); keys.forEach(k=>shuffle(groups[k]));
  const out = []; let i = 0;
  while(out.length < n && keys.some(k=>groups[k].length)){ const k = keys[i % keys.length]; if(groups[k].length) out.push(groups[k].pop()); i++; }
  return shuffle(out);
}
function quizCount(part){ return Math.min(part.quiz.count, part.quiz.pool.length); }
function passNeeded(part){ return Math.ceil(quizCount(part) * CFG.passPercent / 100); }

function gradeQuiz(part){
  const A = currentAttempt; const qs = PS(part.id).quiz;
  let score = 0; const missed = []; const detail = [];
  A.items.forEach((it,k)=>{ const ok = A.answers[k]===it.q.answer; if(ok) score++; else missed.push(it.q.topic); detail.push({q:it.q, chosen:A.answers[k], ok}); });
  const total = A.items.length, pct = Math.round(100*score/total), passed = pct >= CFG.passPercent;
  const rec = { n: qs.attempts.length+1, ts: Date.now(), score, total, pct, passed, missed };
  if(!S.teacher){
    qs.attempts.push(rec);
    if(passed){ qs.passed = true; if(!qs.best || pct > qs.best.pct) qs.best = { score, total, pct, ts: rec.ts, n: rec.n }; }
    else qs.fails++;
    save();
  }
  lastResult = { part: part.id, rec, detail, teacher: S.teacher };
  currentAttempt = null;
  go({name:'part', part:part.id, page:'result'});
  if(passed) confetti();

    } else {
      const left = CFG.reviewAfterFails - qs.fails;
      if(!R.teacher) box.appendChild(el('p',{class:'small muted'}, 'You can try ' + left + ' more time' + (left===1?'':'s') + ' before a quick review is required.'));
      btns.appendChild(el('button',{class:'btn btn-primary', onclick:()=>startQuiz(part)},'Try again with new questions →'));
    }
    btns.appendChild(el('button',{class:'btn', onclick:()=>go({name:'part',part:part.id,page:'quiz'})},'Back to Check overview'));
    box.appendChild(btns);
  }
  card.appendChild(box);
  return card;
}

/* ---------- REMEDIATION (Power-Up Review) ---------- */
function renderReview(part){
  const qs = PS(part.id).quiz;
  const card = el('div',{class:'card'});
  card.appendChild(el('div',{class:'eyebrow'}, 'Part ' + part.num + ' · Power-Up Review'));
  card.appendChild(el('h2',{}, '⚡ Power-Up Review'));
  if(!needsReview(part) && !S.teacher){
    card.appendChild(el('p',{}, 'No review is needed right now.'));
    card.appendChild(el('button',{class:'btn btn-primary', onclick:()=>go({name:'part',part:part.id,page:'quiz'})},'Back to the Check for Understanding'));
    return card;
  }
  const round = qs.reviews + 1;
  card.appendChild(el('p',{class:'lead'}, 'Let’s recharge before your next try. Read the key ideas below (the ones you missed most are first), then answer the practice questions. When they are all correct, the Check for Understanding unlocks again.'));
  const counts = {}; qs.attempts.slice(-CFG.reviewAfterFails).forEach(a=>a.missed.forEach(t=>counts[t]=(counts[t]||0)+1));
  const topics = Object.keys(part.quiz.topics).sort((a,b)=>(counts[b]||0)-(counts[a]||0));
  card.appendChild(el('h3',{}, 'Step 1: Key ideas'));
  topics.forEach(t=>{
    const info = part.quiz.topics[t];
    card.appendChild(el('div',{class:'review-card' + (counts[t]?' missed':'')}, el('h4',{}, info.name, counts[t]? el('span',{class:'badge', style:'margin-left:8px;background:var(--bad-soft);color:#8a1c1c'}, 'missed ' + counts[t] + '×') : null), el('div',{html:info.review})));
  });
  card.appendChild(el('h3',{}, 'Step 2: Practice'));
  const foot = el('div',{class:'sec-foot', style:'margin-top:16px'});
  const btn = el('button',{class:'btn btn-primary'}, 'Finish review & unlock the Check →');
  const lbl = el('div',{class:'lbl'}); const bar = el('i');
  const ids = part.remediation.map(q=>'rv' + round + ':' + q.id);
  const ctx = { pid: part.id, refresh: upd };
  function upd(){ const n = ids.filter(id=>isItemDone(part.id,id)).length; lbl.textContent = n + ' of ' + ids.length + ' practice questions correct'; bar.style.width = Math.round(100*n/ids.length)+'%'; btn.disabled = n < ids.length && !S.teacher; }
  part.remediation.forEach(q=>card.appendChild(renderMC(Object.assign({}, q, {id:'rv'+round+':'+q.id, label:'Practice'}), ctx)));
  btn.addEventListener('click', ()=>{ if(!S.teacher){ qs.fails = 0; qs.reviews++; save(); } go({name:'part',part:part.id,page:'quiz'}); });
  foot.appendChild(el('div',{class:'prog'}, lbl, el('div',{class:'pbar'}, bar)));
  foot.appendChild(btn);
  const box = el('div',{}, card, foot);
  upd();
  return box;
}

/* ---------- CERTIFICATE ---------- */
function certInfo(part){
  const qs = PS(part.id).quiz;
  if(qs.best) return qs.best;
  return { score: quizCount(part), total: quizCount(part), pct: 100, ts: Date.now(), n: 1, preview: true };
}
function renderCert(part){
  const box = el('div',{});
  if(!certUnlocked(part)){
    box.appendChild(el('div',{class:'card lock-box'}, el('div',{class:'big'},'🔒'), el('p',{}, 'Pass the Check for Understanding to earn your Part ' + part.num + ' certificate.')));
    return box;
  }
  if(!hasName()){
    const c = el('div',{class:'card'}, el('h3',{style:'margin-top:0'},'Type your name for the certificate'), nameForm(()=>render()));
    box.appendChild(c); return box;
  }
  const info = certInfo(part);
  const preview = S.teacher && !PS(part.id).quiz.passed;
  const head = el('div',{class:'card'},
    el('div',{class:'eyebrow'}, 'Part ' + part.num + ' complete'),
    el('h2',{}, '🏆 Congratulations, ' + S.student.first + '!'),
    el('p',{}, 'You earned your certificate for ' + part.certTitle + '. ' + CFG.certInstructions),
    el('div',{class:'btn-row'},
      el('button',{class:'btn btn-primary', onclick:()=>window.print()}, '🖨 Print / Save as PDF'),
      el('button',{class:'btn btn-teal', onclick:()=>showCertImage(part, info, preview)}, '🖼 Get certificate image'),
      el('button',{class:'btn', onclick:()=>go({name:'home'})}, '⌂ Back to home')));
  box.appendChild(head);
  const cert = el('div',{class:'cert', id:'certificate'},
    el('div',{class:'c-course'}, CFG.course + ' · ' + CFG.title),
    el('div',{class:'c-title'}, 'Certificate of Completion'),
    el('div',{class:'c-small'}, 'This certifies that'),
    el('div',{class:'c-name'}, fullName()),
    el('div',{class:'c-small'}, 'has successfully completed'),
    el('div',{class:'c-part'}, part.certTitle),
    el('div',{class:'c-small'}, part.certSub),
    el('div',{class:'c-meta'},
      el('div',{}, el('b',{}, info.score + ' / ' + info.total + ' (' + info.pct + '%)'), 'Check for Understanding'),
      el('div',{}, el('b',{}, fmtDate(info.ts)), 'Date'),
      S.student.period ? el('div',{}, el('b',{}, 'Period ' + S.student.period), 'Class') : null),
    el('div',{class:'seal', html:G.seal()}),
    preview ? el('div',{class:'preview-mark'}, 'PREVIEW') : null);
  box.appendChild(el('div',{class:'cert-wrap'}, cert));
  const other = PARTS.find(p=>p.id!==part.id);
  if(other && !PS(other.id).quiz.passed) box.appendChild(el('p',{class:'center muted', style:'margin-top:18px'}, 'Next: ', el('a',{href:'#', onclick:(e)=>{ e.preventDefault(); go({name:'part',part:other.id,page:defaultPage(other)}); }}, 'Part ' + other.num + ': ' + other.title + ' →')));
  return box;
}
function drawCert(part, info, preview){
  const W=1600, H=1131;
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const x = c.getContext('2d');
  x.fillStyle='#fffdf6'; x.fillRect(0,0,W,H);
  x.strokeStyle='#1d3a8a'; x.lineWidth=8; x.strokeRect(30,30,W-60,H-60);
  x.strokeStyle='#c9a227'; x.lineWidth=3; x.strokeRect(50,50,W-100,H-100);
  x.textAlign='center'; x.textBaseline='alphabetic';
  const T = (txt, y, font, color, spacing) => { x.font = font; x.fillStyle = color; try{ x.letterSpacing = spacing||'0px'; }catch(e){} x.fillText(txt, W/2, y); try{ x.letterSpacing='0px'; }catch(e){} };
  T((CFG.course + ' · ' + CFG.title).toUpperCase(), 180, '700 26px "Segoe UI", Arial, sans-serif', '#0f9c9a', '5px');
  T('Certificate of Completion', 290, 'bold 78px Georgia, "Times New Roman", serif', '#1d3a8a');
  T('This certifies that', 370, '30px "Segoe UI", Arial, sans-serif', '#475467');
  let size = 96; const name = fullName();
  x.font = `italic ${size}px Georgia, serif`; while(x.measureText(name).width > 1200 && size>40){ size-=4; x.font = `italic ${size}px Georgia, serif`; }
  T(name, 485, `italic ${size}px Georgia, "Times New Roman", serif`, '#111827');
  const nw = Math.min(1250, x.measureText(name).width + 100);
  x.strokeStyle='#c9a227'; x.lineWidth=3; x.beginPath(); x.moveTo(W/2-nw/2, 515); x.lineTo(W/2+nw/2, 515); x.stroke();
  T('has successfully completed', 580, '30px "Segoe UI", Arial, sans-serif', '#475467');
  T(part.certTitle, 660, 'bold 50px "Segoe UI", Arial, sans-serif', '#1d3a8a');
  T(part.certSub, 715, '28px "Segoe UI", Arial, sans-serif', '#475467');
  const cols = [[info.score + ' / ' + info.total + ' (' + info.pct + '%)', 'Check for Understanding'], [fmtDate(info.ts), 'Date']];
  if(S.student.period) cols.push(['Period ' + S.student.period, 'Class']);
  const colW = 360, startX = W/2 - (cols.length*colW + (cols.length-1)*40)/2;
  cols.forEach((col,i)=>{ const cx = startX + i*(colW+40) + colW/2;
    x.strokeStyle='#98a2b3'; x.lineWidth=2; x.beginPath(); x.moveTo(cx-colW/2+20, 830); x.lineTo(cx+colW/2-20, 830); x.stroke();
    x.textAlign='center'; x.font='bold 30px "Segoe UI", Arial, sans-serif'; x.fillStyle='#111827'; x.fillText(col[0], cx, 872);
    x.font='24px "Segoe UI", Arial, sans-serif'; x.fillStyle='#475467'; x.fillText(col[1], cx, 906); });
  // seal
  const sx = W-160, sy = H-160; x.save(); x.translate(sx, sy); x.beginPath();
  for(let i=0;i<48;i++){ const a=Math.PI*i/24, r=i%2?60:70; x.lineTo(r*Math.cos(a), r*Math.sin(a)); } x.closePath(); x.fillStyle='#c9a227'; x.fill();
  x.beginPath(); x.arc(0,0,52,0,Math.PI*2); x.fillStyle='#1d3a8a'; x.fill(); x.strokeStyle='#f5e39a'; x.lineWidth=3; x.stroke();
  x.scale(0.8,0.8); x.beginPath(); x.moveTo(6,-44); x.lineTo(-22,8); x.lineTo(-2,8); x.lineTo(-8,44); x.lineTo(24,-10); x.lineTo(4,-10); x.closePath(); x.fillStyle='#ffc53d'; x.fill(); x.restore();
  if(preview){ x.save(); x.translate(W/2,H/2); x.rotate(-0.3); x.font='900 200px Arial'; x.fillStyle='rgba(126,34,206,.13)'; x.fillText('PREVIEW',0,60); x.restore(); }
  return c;
}
function showCertImage(part, info, preview){
  let url;
  try{ url = drawCert(part, info, preview).toDataURL('image/png'); }catch(e){ alert('Sorry — the image could not be made. Use Print / Save as PDF or take a screenshot instead.'); return; }
  const fname = ('Part' + part.num + '_Certificate_' + fullName()).replace(/[^a-z0-9_]+/gi,'_') + '.png';
  let close;
  close = modal(el('div',{},
    el('h3',{style:'margin-top:0'}, 'Your certificate image'),
    el('p',{class:'small muted'}, 'Click Download. If nothing downloads, right-click the picture and choose “Save image as…”, or take a screenshot.'),
    el('img',{src:url, alt:'Certificate for ' + fullName()}),
    el('div',{class:'btn-row', style:'margin-top:12px'}, el('a',{class:'btn btn-primary', href:url, download:fname}, '⬇ Download'), el('button',{class:'btn', onclick:()=>close()}, 'Close'))), {wide:true});
}

/* ---------- boot ---------- */
render();
})();

</script>
