<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Lab · Intro to Robotics</title>
<style>
:root{
  --bg:#f3f6fb; --panel:#ffffff; --ink:#172033; --muted:#5a6679; --line:#dbe2ee; --soft:#eef2f9;
  --brand:#2355d8; --brand-ink:#ffffff; --brand-soft:#e6edff;
  --teal:#0f9c9a; --teal-soft:#e0f5f4;
  --spark:#ffc53d; --spark-soft:#fff5d6;
  --ok:#15803d; --ok-soft:#e5f6ea; --bad:#c62828; --bad-soft:#fdeaea; --warn:#b45309; --warn-soft:#fff3e0;
  --top:#0f1729; --top-ink:#e8eefc;
  --radius:14px; --topbar-h:60px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h2{font-size:1.6rem} h3{font-size:1.22rem;margin-top:1.6em} h4{font-size:1.05rem}
p{margin:0 0 .9em}
ul,ol{margin:0 0 1em;padding-left:1.4em}
li{margin:.25em 0}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar-h);background:var(--top);color:var(--top-ink);display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;color:inherit;padding:6px 4px;border-radius:8px}
.brand svg{flex:none}
.brand small{display:block;font-weight:500;opacity:.7;font-size:.72rem;letter-spacing:.3px}
.brand span.t{font-size:1.02rem;line-height:1.1;text-align:left}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.chip.warn{background:#7c2d12;color:#ffedd5}
.chip button{background:none;border:0;color:#9ec1ff;text-decoration:underline;cursor:pointer;padding:0;font-size:.8rem}
.top-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:var(--top-ink);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.top-btn:hover{background:rgba(255,255,255,.2)}
.teacher-banner{background:#7e22ce;color:#fff;text-align:center;font-size:.88rem;padding:6px 10px}
.teacher-banner button{margin-left:10px;background:#fff;color:#7e22ce;border:0;border-radius:6px;padding:2px 10px;cursor:pointer;font-weight:600}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:600;font-size:.98rem;transition:transform .05s ease, background .15s, box-shadow .15s;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.choice:focus-visible,.side-item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:#1b46bb}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-teal:hover{background:#0b807e}
.btn-spark{background:var(--spark);border-color:#e9ad1f;color:#3b2a00}
.btn-spark:hover{background:#ffb70f}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- layout ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
.part-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.sidebar{position:sticky;top:calc(var(--topbar-h) + 18px);align-self:start;max-height:calc(100vh - var(--topbar-h) - 36px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.sidebar h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:4px 6px 10px}
.side-part-title{font-weight:700;margin:0 6px 2px;font-size:1.02rem}
.side-progress{margin:8px 6px 14px}
.side-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 8px;cursor:pointer;font-size:.93rem;line-height:1.3;color:var(--ink)}
.side-item:hover:not([disabled]){background:var(--soft)}
.side-item.active{background:var(--brand-soft);color:#11307e;font-weight:600}
.side-item[disabled]{cursor:not-allowed;color:#98a2b3}
.side-item .ico{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--muted)}
.side-item.done .ico{background:var(--ok);color:#fff}
.side-item.active .ico{background:var(--brand);color:#fff}
.side-item[disabled] .ico{background:#f1f3f7}
.side-sep{height:1px;background:var(--line);margin:10px 4px}
.main{min-width:0}

/* ---------- cards / content ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px;margin-bottom:20px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:6px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--teal)}
.time-pill{flex:none;font-size:.8rem;background:var(--teal-soft);color:#0b5f5e;border-radius:999px;padding:4px 10px;font-weight:600}
.lead{font-size:1.08rem;color:#2a3549}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}

.callout{border-radius:12px;padding:14px 16px 12px 16px;margin:16px 0;border:1px solid;display:flex;gap:12px}
.callout .c-ico{font-size:1.35rem;line-height:1.2;flex:none}
.callout .c-body > :last-child{margin-bottom:0}
.callout .c-title{font-weight:700;margin-bottom:4px}
.callout.tip{background:var(--brand-soft);border-color:#c8d6fb}
.callout.fact{background:var(--spark-soft);border-color:#f5dd97}
.callout.key{background:var(--teal-soft);border-color:#b5e5e3}
.callout.warn{background:var(--warn-soft);border-color:#f6cf9b}
.callout.goal{background:#f4f0ff;border-color:#dcd0fb}

.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0 18px}
.vocab .v{background:var(--soft);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.vocab .v b.term{display:block;font-size:1.02rem;margin-bottom:2px}
.vocab .v .v-ico{font-size:1.4rem}
.vocab .v p{margin:0;font-size:.95rem;color:#2d384b}

.big3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 0}
.big3 .b{border-radius:14px;padding:16px;border:2px solid}
.big3 .b h4{margin:0 0 6px;font-size:1.15rem}
.big3 .b .unit{font-size:.9rem;font-weight:700;margin-bottom:8px;display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.7)}
.big3 .b p{font-size:.95rem;margin:0 0 .5em}
.b-v{background:#fff6e0;border-color:#f3c75a}
.b-i{background:#e8f0ff;border-color:#8fb0ff}
.b-r{background:#ffeceb;border-color:#f4a6a1}

figure{margin:16px 0;text-align:center}
figure svg{max-width:100%;height:auto}
figcaption{font-size:.88rem;color:var(--muted);margin-top:6px}
.fig-frame{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px}

.steps{counter-reset:st;list-style:none;padding:0;margin:12px 0 16px}
.steps li{counter-increment:st;position:relative;padding:8px 0 8px 42px;margin:0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.9rem}

.formula{font-size:2rem;font-weight:800;text-align:center;letter-spacing:1px;margin:10px 0;color:#11307e}
.formula-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0}
.formula-cards div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.formula-cards b{display:block;font-size:1.35rem;color:#11307e}
.example{border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:12px 16px;margin:12px 0;background:#fbfdff}
.example .ex-t{font-weight:700;margin-bottom:4px}
.example table{border-collapse:collapse;font-size:.95rem}
.example td{padding:2px 10px 2px 0;vertical-align:top}
.example td:first-child{font-weight:700;color:var(--muted);white-space:nowrap}

table.compare{width:100%;border-collapse:collapse;margin:12px 0;font-size:.95rem}
table.compare th,table.compare td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.compare th{background:var(--soft)}

/* ---------- questions ---------- */
.q{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0;background:#fcfdff;position:relative}
.q.is-done{border-color:#a7dcb7;background:#f7fcf8}
.q-label{font-size:.75rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--brand);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.q.is-done .q-label{color:var(--ok)}
.q-label .done-tag{background:var(--ok);color:#fff;border-radius:999px;padding:1px 8px;font-size:.7rem;letter-spacing:.4px}
.q-text{font-weight:600;margin-bottom:10px}
.q-fig{margin:6px 0 12px;text-align:center}
.q-fig svg{max-width:100%;height:auto}
.q-fig .glow{opacity:0;transition:opacity .5s}
.q-fig.revealed .glow{opacity:1}
.choices{display:grid;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;line-height:1.4;transition:border-color .12s, background .12s}
.choice:hover:not([disabled]){border-color:#9fb6f2;background:#f7f9ff}
.choice .cl{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--muted)}
.choice.selected{border-color:var(--brand);background:var(--brand-soft)}
.choice.selected .cl{background:var(--brand);color:#fff}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.correct .cl{background:var(--ok);color:#fff}
.choice.wrong{border-color:#f0a3a3;background:var(--bad-soft);opacity:.85}
.choice.wrong .cl{background:var(--bad);color:#fff}
.choice[disabled]{cursor:default}
.feedback{margin-top:10px;border-radius:10px;padding:0;font-size:.96rem}
.feedback:empty{display:none}
.feedback.ok{background:var(--ok-soft);color:#0f5b2c;padding:10px 12px;border:1px solid #b9e3c6}
.feedback.bad{background:var(--bad-soft);color:#8a1c1c;padding:10px 12px;border:1px solid #f3c1c1}
.feedback.info{background:var(--brand-soft);color:#1a3a8f;padding:10px 12px;border:1px solid #c8d6fb}
.num-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num-row input{width:150px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;font-size:1.05rem;background:#fff}
.num-row .unit{font-weight:700;color:var(--muted)}
textarea.short{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;background:#fff}
.wc{font-size:.82rem;color:var(--muted)}
.sample{margin-top:10px;background:var(--teal-soft);border:1px solid #b5e5e3;border-radius:10px;padding:10px 12px;font-size:.95rem}

.sort-list{display:grid;gap:8px}
.sort-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.sort-row .emo{font-size:1.4rem;width:32px;text-align:center}
.sort-row .lbl{flex:1;min-width:160px;font-weight:600}
.sort-row .why{flex-basis:100%;font-size:.88rem;color:#0f5b2c;padding-left:42px}
.sort-row.right{background:var(--ok-soft);border-color:#b9e3c6}
.sort-row .tag{font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--ok);color:#fff}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.match-table{width:100%;border-collapse:separate;border-spacing:0 8px}
.match-table td{vertical-align:middle;padding:0 8px}
.match-table td.m-left{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.match-table select{padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;min-width:170px}
.match-table tr.ok select{border-color:var(--ok);background:var(--ok-soft)}
.match-table tr.no select{border-color:var(--bad);background:var(--bad-soft)}
.match-table .m-left svg{display:block}

.record-table{width:100%;border-collapse:collapse}
.record-table td,.record-table th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.record-table select{padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:#fff}

/* ---------- sims ---------- */
.sim{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:16px 0;background:#fff}
.sim-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--top);color:var(--top-ink)}
.sim-bar .st{font-weight:700;flex:1;min-width:160px}
.sim-bar a,.sim-bar button{font-size:.82rem;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:8px;text-decoration:none;cursor:pointer}
.sim-bar button.on{background:var(--spark);color:#3b2a00;border-color:var(--spark)}
.sim-stage{position:relative;width:100%;aspect-ratio:16/10;background:#0b1220}
.sim-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sim-placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#dce6ff;padding:20px;background:radial-gradient(circle at 50% 40%, #1f3a7a 0%, #0b1220 70%)}
.sim-note{font-size:.82rem;color:var(--muted);padding:8px 12px;background:var(--soft)}
.sim.pinned{position:sticky;top:calc(var(--topbar-h) + 6px);z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sim.pinned .sim-stage{aspect-ratio:auto;height:52vh}

/* ---------- widgets ---------- */
.widget{border:2px solid #cbd7f3;border-radius:16px;margin:18px 0;background:#fff;overflow:hidden}
.widget-head{background:linear-gradient(90deg,#2355d8,#0f9c9a);color:#fff;padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.widget-body{padding:14px 16px}
.widget svg{display:block;margin:0 auto;max-width:100%;height:auto;touch-action:manipulation}
.w-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.w-status{margin-top:10px;text-align:center;font-weight:700;border-radius:10px;padding:8px 10px;background:var(--soft)}
.w-status.on{background:var(--ok-soft);color:#0f5b2c}
.w-status.off{background:#eef1f6;color:#475467}
.w-status.danger{background:var(--bad-soft);color:#8a1c1c}
.w-status.warn{background:var(--warn-soft);color:#7c3a06}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.readout{background:#0f1729;color:#9dffb0;border-radius:10px;padding:8px 10px;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace}
.readout small{display:block;color:#b8c4de;font-family:var(--font);font-size:.72rem;letter-spacing:.4px;text-transform:uppercase}
.readout b{font-size:1.25rem}
.slider-row{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.slider-row label{min-width:200px;font-weight:600}
.slider-row input[type=range]{flex:1;min-width:180px;accent-color:var(--brand)}
.slider-row output{min-width:60px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace}
.tasks{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.tasks .t{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:.95rem}
.tasks .t .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #b7c3d7;display:grid;place-items:center;font-size:.8rem;color:#fff;margin-top:2px}
.tasks .t.done .box{background:var(--ok);border-color:var(--ok)}
.tasks .t.done span.tx{color:#0f5b2c}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--brand);color:#fff}
.res-picker{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.res-picker button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace}
.res-picker button.on{border-color:var(--brand);background:var(--brand-soft)}
.practice-box{background:var(--soft);border-radius:12px;padding:14px 16px}
.practice-box .prob{font-size:1.08rem;font-weight:600;margin-bottom:10px}
.pbar{height:10px;background:#e3e8f2;border-radius:999px;overflow:hidden}
.pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--brand));border-radius:999px;transition:width .3s}

/* ---------- section footer ---------- */
.sec-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow)}
.sec-foot .prog{flex:1;min-width:220px}
.sec-foot .prog .lbl{font-size:.9rem;color:var(--muted);margin-bottom:6px}

/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,#0f1729 0%,#1d3a8a 60%,#0f9c9a 130%);color:#fff;border-radius:22px;padding:34px 34px 30px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h1{font-size:2.1rem;margin-bottom:8px}
.hero p{color:#dbe6ff;max-width:640px;font-size:1.06rem}
.hero .bolt-bg{position:absolute;right:-20px;top:-20px;opacity:.14}
.name-card{margin-top:22px}
.name-grid{display:grid;grid-template-columns:1fr 1fr 170px;gap:12px}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.field input{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:1rem}
.part-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.part-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.part-card .pc-top{display:flex;align-items:center;gap:12px}
.part-card .pc-num{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.3rem;color:#fff}
.part-card h3{margin:0;font-size:1.25rem}
.part-card ul{margin:0;font-size:.95rem;color:#344054}
.part-card .pc-foot{margin-top:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:999px}
.badge.gold{background:#fff1c2;color:#7a5200;border:1px solid #f1cf62}
.badge.gray{background:var(--soft);color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.how b{display:block;margin-bottom:2px}
.footer{text-align:center;color:var(--muted);font-size:.82rem;padding:20px}
.footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.82rem}

/* ---------- quiz ---------- */
.quiz-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.quiz-rules div{background:var(--soft);border-radius:12px;padding:12px;text-align:center}
.quiz-rules b{display:block;font-size:1.5rem;color:#11307e}
.attempts{width:100%;border-collapse:collapse;font-size:.93rem;margin-top:8px}
.attempts td,.attempts th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.qq-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;font-size:.85rem;margin-right:8px}
.score-ring{width:150px;height:150px;margin:0 auto 10px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .sv{position:absolute;inset:0;display:grid;place-items:center;font-size:1.9rem;font-weight:800}
.missed-list li{margin:.4em 0}
.review-card{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;background:#fff}
.review-card.missed{border-color:#f3c1c1;background:#fffafa}
.review-card h4{margin:0 0 6px}

/* ---------- certificate ---------- */
.cert-wrap{display:flex;justify-content:center}
.cert{width:100%;max-width:860px;aspect-ratio:1.414/1;background:#fffdf6;border-radius:6px;position:relative;box-shadow:0 10px 40px rgba(16,24,40,.18);padding:4.2% 6%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:#1d2433}
.cert::before{content:"";position:absolute;inset:14px;border:3px solid #1d3a8a;border-radius:4px;pointer-events:none}
.cert::after{content:"";position:absolute;inset:22px;border:1.5px solid #c9a227;border-radius:2px;pointer-events:none}
.cert .c-course{font-size:.85rem;letter-spacing:3px;text-transform:uppercase;color:#0f9c9a;font-weight:700}
.cert .c-title{font-family:Georgia,"Times New Roman",serif;font-size:2.3rem;color:#1d3a8a;margin:4px 0 6px;font-weight:700}
.cert .c-small{font-size:.95rem;color:#475467}
.cert .c-name{font-family:Georgia,"Times New Roman",serif;font-size:2.6rem;font-style:italic;color:#111827;border-bottom:2px solid #c9a227;padding:0 30px 4px;margin:8px 0 10px;line-height:1.2}
.cert .c-part{font-size:1.35rem;font-weight:700;color:#1d3a8a;margin:4px 0}
.cert .c-meta{display:flex;gap:40px;justify-content:center;margin-top:18px;font-size:.9rem}
.cert .c-meta div{border-top:1.5px solid #98a2b3;padding-top:4px;min-width:150px}
.cert .c-meta b{display:block;font-size:1rem;color:#111827}
.cert .seal{position:absolute;right:38px;bottom:36px;width:74px;height:74px}
.cert .seal svg{width:100%;height:100%;display:block}
.cert .bolt-l{position:absolute;left:7%;bottom:9%;width:70px;opacity:.9}
.cert .preview-mark{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem;font-weight:900;color:rgba(126,34,206,.13);transform:rotate(-18deg);pointer-events:none}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,41,.6);z-index:200;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal.wide{max-width:900px}
.modal img{max-width:100%;border:1px solid var(--line);border-radius:8px}

.lock-box{text-align:center;padding:40px 20px}
.lock-box .big{font-size:3rem}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:300}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .part-layout{grid-template-columns:1fr;padding:14px 12px 50px}
  .sidebar{position:static;max-height:none}
  .part-cards{grid-template-columns:1fr}
  .name-grid{grid-template-columns:1fr}
  .card{padding:20px 16px}
  .topbar .chip.hide-sm{display:none}
  .choices.two{grid-template-columns:1fr}
  .hero{padding:26px 20px}
  .hero h1{font-size:1.6rem}
}

/* ---------- print (certificate only) ---------- */
@media print{
  @page{size:landscape;margin:10mm}
  body{background:#fff}
  .topbar,.teacher-banner,.footer,.sidebar,.main .card,.main > div > p,.modal-bg,.confetti{display:none !important}
  .part-layout{display:block;padding:0;margin:0;max-width:none}
  .cert-wrap{display:block}
  .cert{width:100%;max-width:none;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>

<body>
<div id="app"></div>
<noscript><p style="padding:20px;font-family:sans-serif">This activity needs JavaScript turned on.</p></noscript>
<script>
/* ============ SVG graphics helpers ============ */
const G = (function(){
  const INK = '#1d2433';
  const S = (vb, inner, w, extra) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" ${w?`width="${w}"`:''} ${extra||''} role="img">${inner}</svg>`;

  /* ---- schematic symbols (viewBox 0 0 120 60) ---- */
  const sym = {
    wire: `<line x1="6" y1="30" x2="114" y2="30"/>`,
    battery: `<line x1="6" y1="30" x2="44" y2="30"/><line x1="44" y1="10" x2="44" y2="50"/><line x1="54" y1="20" x2="54" y2="40" stroke-width="6"/><line x1="66" y1="10" x2="66" y2="50"/><line x1="76" y1="20" x2="76" y2="40" stroke-width="6"/><line x1="76" y1="30" x2="114" y2="30"/><text x="33" y="16" font-size="14" fill="${INK}" stroke="none" font-weight="700">+</text>`,
    bulb: `<line x1="6" y1="30" x2="40" y2="30"/><circle cx="60" cy="30" r="20" fill="#fff"/><line x1="46" y1="16" x2="74" y2="44"/><line x1="74" y1="16" x2="46" y2="44"/><line x1="80" y1="30" x2="114" y2="30"/>`,
    resistor: `<polyline points="6,30 30,30 35,17 45,43 55,17 65,43 75,17 85,43 90,30 114,30"/>`,
    switchOpen: `<line x1="6" y1="30" x2="40" y2="30"/><circle cx="42" cy="30" r="3.5" fill="${INK}"/><line x1="42" y1="30" x2="76" y2="10"/><circle cx="80" cy="30" r="3.5" fill="${INK}"/><line x1="80" y1="30" x2="114" y2="30"/>`,
    switchClosed: `<line x1="6" y1="30" x2="40" y2="30"/><circle cx="42" cy="30" r="3.5" fill="${INK}"/><line x1="42" y1="30" x2="80" y2="30"/><circle cx="80" cy="30" r="3.5" fill="${INK}"/><line x1="80" y1="30" x2="114" y2="30"/>`,
    led: `<line x1="6" y1="30" x2="46" y2="30"/><polygon points="46,14 46,46 72,30" fill="#fff"/><line x1="74" y1="14" x2="74" y2="46"/><line x1="74" y1="30" x2="114" y2="30"/><line x1="58" y1="12" x2="68" y2="3" stroke-width="2"/><polyline points="62,3 68,3 68,9" stroke-width="2"/><line x1="67" y1="16" x2="77" y2="7" stroke-width="2"/><polyline points="71,7 77,7 77,13" stroke-width="2"/>`,
    motor: `<line x1="6" y1="30" x2="40" y2="30"/><circle cx="60" cy="30" r="20" fill="#fff"/><text x="60" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="${INK}" stroke="none">M</text><line x1="80" y1="30" x2="114" y2="30"/>`,
    ammeter: `<line x1="6" y1="30" x2="40" y2="30"/><circle cx="60" cy="30" r="20" fill="#fff"/><text x="60" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="${INK}" stroke="none">A</text><line x1="80" y1="30" x2="114" y2="30"/>`,
    voltmeter: `<line x1="6" y1="30" x2="40" y2="30"/><circle cx="60" cy="30" r="20" fill="#fff"/><text x="60" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="${INK}" stroke="none">V</text><line x1="80" y1="30" x2="114" y2="30"/>`
  };
  function symbol(name, w){ return S('0 0 120 60', `<g fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${sym[name]}</g>`, w||120); }

  function symbolChart(){
    const items = [['wire','Wire'],['battery','Battery (+ is the long line)'],['bulb','Light bulb'],['resistor','Resistor'],['switchOpen','Switch (open)'],['switchClosed','Switch (closed)'],['led','LED'],['motor','Motor']];
    return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">` +
      items.map(([k,l])=>`<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 6px">${symbol(k,120)}<div class="small" style="font-weight:600">${l}</div></div>`).join('') + `</div>`;
  }

  /* ---- realistic parts ---- */
  const defs = `<defs><radialGradient id="glowG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff7b0" stop-opacity="1"/><stop offset="45%" stop-color="#ffd84d" stop-opacity=".75"/><stop offset="100%" stop-color="#ffc53d" stop-opacity="0"/></radialGradient></defs>`;
  function battery(x, y){ // body top-left x,y ; body 50x120; + nub on top
    return `<g>
      <rect x="${x+17}" y="${y-10}" width="16" height="11" rx="2" fill="#b9bec7" stroke="#6b7280"/>
      <rect x="${x}" y="${y}" width="50" height="120" rx="7" fill="#394150" stroke="#1f2430" stroke-width="2"/>
      <rect x="${x}" y="${y}" width="50" height="34" rx="7" fill="#d9822b" stroke="#1f2430" stroke-width="2"/>
      <rect x="${x+1}" y="${y+26}" width="48" height="8" fill="#d9822b"/>
      <rect x="${x+4}" y="${y+118}" width="42" height="5" rx="2" fill="#b9bec7" stroke="#6b7280"/>
      <text x="${x+25}" y="${y+25}" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">+</text>
      <text x="${x+25}" y="${y+108}" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">−</text>
      <text x="${x+25}" y="${y+72}" text-anchor="middle" font-size="12" font-weight="700" fill="#cfd5df">1.5 V</text>
    </g>`;
  }
  // bulb with glass centre cx,cy. side contact: (cx+11, cy+32); tip: (cx, cy+50)
  function bulb(cx, cy, opts){
    opts = opts||{};
    const glow = opts.glow ? `<circle class="glow" cx="${cx}" cy="${cy}" r="46" fill="url(#glowG)"/>` : '';
    return `<g>${glow}
      <circle cx="${cx}" cy="${cy}" r="24" fill="#eef6ff" fill-opacity=".85" stroke="#8a9ab3" stroke-width="2"/>
      <rect x="${cx-11}" y="${cy+15}" width="22" height="8" fill="#eef6ff" stroke="none"/>
      <line x1="${cx-11}" y1="${cy+19}" x2="${cx-11}" y2="${cy+23}" stroke="#8a9ab3" stroke-width="2"/>
      <line x1="${cx+11}" y1="${cy+19}" x2="${cx+11}" y2="${cy+23}" stroke="#8a9ab3" stroke-width="2"/>
      <polyline points="${cx-5},${cy+22} ${cx-6},${cy-2}" stroke="#6b7280" stroke-width="1.6" fill="none"/>
      <polyline points="${cx+5},${cy+22} ${cx+6},${cy-2}" stroke="#6b7280" stroke-width="1.6" fill="none"/>
      <polyline points="${cx-6},${cy-2} ${cx-4},${cy-6} ${cx-2},${cy+1} ${cx},${cy-6} ${cx+2},${cy+1} ${cx+4},${cy-6} ${cx+6},${cy-2}" stroke="#e0752d" stroke-width="1.8" fill="none"/>
      <rect x="${cx-11}" y="${cy+22}" width="22" height="20" rx="2" fill="#c5cbd4" stroke="#7d8594" stroke-width="1.5"/>
      <line x1="${cx-11}" y1="${cy+27}" x2="${cx+11}" y2="${cy+25}" stroke="#8b93a1" stroke-width="1.5"/>
      <line x1="${cx-11}" y1="${cy+32}" x2="${cx+11}" y2="${cy+30}" stroke="#8b93a1" stroke-width="1.5"/>
      <line x1="${cx-11}" y1="${cy+37}" x2="${cx+11}" y2="${cy+35}" stroke="#8b93a1" stroke-width="1.5"/>
      <rect x="${cx-7}" y="${cy+42}" width="14" height="4" fill="#20242c"/>
      <rect x="${cx-4}" y="${cy+45}" width="8" height="5" rx="2" fill="#9aa1ad" stroke="#6b7280"/>
    </g>`;
  }
  const wire = (d, color) => `<path d="${d}" fill="none" stroke="${color||'#d33'}" stroke-width="5" stroke-linecap="round"/><path d="${d}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-linecap="round"/>`;
  const dot = (x,y) => `<circle cx="${x}" cy="${y}" r="3.5" fill="#b87333" stroke="#6b3e12"/>`;

  // "Will it light?" setups
  function setup(which){
    let inner = defs + battery(30, 90);
    const W1 = '#d63a3a', W2 = '#2b2f36';
    if(which==='A'){ // bulb sits on + with tip; wire side -> bottom
      inner += wire('M66 62 C 160 58, 175 240, 62 214', W2) + bulb(55,30,{glow:true}) + dot(66,62) + dot(62,214);
    } else if(which==='B'){ // tip on + , nothing else
      inner += bulb(55,30,{glow:false});
    } else if(which==='C'){ // + -> tip, side -> bottom
      inner += wire('M55 79 C 52 20, 118 18, 120 80 C 122 128, 150 142, 160 121', W1) + wire('M171 102 C 212 112, 205 238, 60 214', W2) + bulb(160,71,{glow:true}) + dot(55,79)+dot(160,121)+dot(171,102)+dot(60,214);
    } else if(which==='D'){ // both wires to tip
      inner += wire('M55 79 C 52 20, 118 18, 120 80 C 122 128, 150 142, 158 121', W1) + wire('M60 214 C 150 236, 175 175, 162 122', W2) + bulb(160,71,{glow:false}) + dot(55,79)+dot(160,121)+dot(60,214);
    } else if(which==='E'){ // + -> tip, side -> + (both wires on +)
      inner += wire('M171 102 C 218 100, 216 2, 130 6 C 80 8, 66 40, 60 79', W2) + wire('M52 79 C 50 22, 118 20, 120 80 C 122 128, 150 142, 160 121', W1) + bulb(160,71,{glow:false}) + dot(52,79)+dot(60,79)+dot(160,121)+dot(171,102);
    }
    return S('0 0 220 240', inner, 220);
  }

  function bulbDiagram(){
    const cx=150, cy=95;
    return S('0 0 400 232', defs + `
      <g transform="translate(${cx},${cy}) scale(2) translate(${-cx},${-cy})">${bulb(cx,cy,{glow:false})}</g>
      <path d="M173 159 L160 139 L162 91 L138 91 L140 139 L150 193" fill="none" stroke="#2355d8" stroke-width="3" stroke-dasharray="6 5" stroke-linejoin="round"/>
      <g font-size="13" font-weight="600" fill="#172033">
        <line x1="189" y1="66" x2="238" y2="44" stroke="#5a6679"/><text x="242" y="48">Glass bulb</text>
        <line x1="165" y1="88" x2="238" y2="86" stroke="#5a6679"/><text x="242" y="90">Filament (thin wire)</text>
        <line x1="175" y1="159" x2="238" y2="150" stroke="#5a6679"/><text x="242" y="147">Side contact</text><text x="242" y="163" font-weight="400" font-size="12">(metal screw part)</text>
        <line x1="156" y1="194" x2="238" y2="200" stroke="#5a6679"/><text x="242" y="204">Tip contact</text><text x="242" y="220" font-weight="400" font-size="12">(bottom point)</text>
        <line x1="8" y1="222" x2="40" y2="222" stroke="#2355d8" stroke-width="3" stroke-dasharray="6 5"/><text x="46" y="226" fill="#2355d8" font-size="12">path of the current</text>
      </g>`, 400);
  }

  function wireCross(){
    let dots='';
    for(let i=0;i<8;i++){ dots += `<circle r="3.5" cy="${70 + (i%2?-5:5)}" fill="#2f6bff" stroke="#fff" stroke-width="1"><animate attributeName="cx" from="40" to="385" dur="6s" begin="${-i*0.75}s" repeatCount="indefinite"/></circle>`; }
    return S('0 0 440 148', `
      <rect x="20" y="50" width="250" height="40" rx="20" fill="#e5484d" stroke="#a61e22" stroke-width="2"/>
      <rect x="36" y="62" width="230" height="16" rx="8" fill="#d7893c" opacity=".55"/>
      <rect x="250" y="57" width="140" height="26" rx="6" fill="#d7893c" stroke="#8a4d12" stroke-width="2"/>
      <line x1="255" y1="64" x2="388" y2="64" stroke="#f3b36f" stroke-width="2"/><line x1="255" y1="70" x2="388" y2="70" stroke="#a9611f" stroke-width="2"/><line x1="255" y1="76" x2="388" y2="76" stroke="#f3b36f" stroke-width="2"/>
      ${dots}
      <g font-size="13" font-weight="700" fill="#172033">
        <line x1="110" y1="50" x2="100" y2="30" stroke="#5a6679"/><text x="24" y="24">Plastic coating = INSULATOR</text>
        <line x1="335" y1="83" x2="335" y2="98" stroke="#5a6679"/><text x="335" y="113" text-anchor="middle">Copper metal = CONDUCTOR</text>
        <text x="24" y="138" fill="#2f6bff" font-weight="600" font-size="12.5">● = free electrons moving through the copper</text>
      </g>`, 440);
  }

  function schematicLoop(opts){
    // battery left, switch top, bulb right
    const sw = opts && opts.closed ? 'switchClosed' : 'switchOpen';
    return S('0 0 300 190', `<g fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="40,70 40,25 110,25"/><polyline points="190,25 260,25 260,65"/><polyline points="260,125 260,165 40,165 40,120"/>
      <g transform="translate(110,-5)">${sym[sw]}</g>
      <g transform="translate(290,35) rotate(90)">${sym.bulb}</g>
      <g transform="translate(10,155) rotate(-90)">${sym.battery}</g>
    </g>`, 300);
  }

  function meterSchematic(){
    const K = INK, BL = '#2355d8', L=60, R=260, T=40, Bt=200;
    return S('0 0 440 232', `
      <g fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="${L},108 ${L},${T} 142,${T}"/>
        <polyline points="178,${T} ${R},${T} ${R},88"/>
        <polyline points="${R},88 ${R+12},94 ${R-12},104 ${R+12},114 ${R-12},124 ${R+12},134 ${R-12},144 ${R},150"/>
        <polyline points="${R},150 ${R},${Bt} ${L},${Bt} ${L},138"/>
        <line x1="40" y1="108" x2="80" y2="108"/><line x1="50" y1="118" x2="70" y2="118" stroke-width="6"/>
        <line x1="40" y1="128" x2="80" y2="128"/><line x1="50" y1="138" x2="70" y2="138" stroke-width="6"/>
        <circle cx="160" cy="${T}" r="18" fill="#fff"/>
      </g>
      <g fill="none" stroke="${BL}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="${R},70 330,70 330,102"/><circle cx="330" cy="120" r="18" fill="#fff"/><polyline points="330,138 330,172 ${R},172"/>
      </g>
      <circle cx="${R}" cy="70" r="4.5" fill="${BL}"/><circle cx="${R}" cy="172" r="4.5" fill="${BL}"/>
      <text x="160" y="47" text-anchor="middle" font-size="19" font-weight="800" fill="${K}">A</text>
      <text x="330" y="127" text-anchor="middle" font-size="19" font-weight="800" fill="${BL}">V</text>
      <g font-size="12.5" font-weight="600" fill="#172033">
        <text x="26" y="112" font-size="15" font-weight="800">+</text>
        <text x="90" y="126">Battery</text>
        <text x="240" y="124" text-anchor="end">Resistor</text>
        <text x="160" y="80" text-anchor="middle">Ammeter: IN the path</text>
        <text x="160" y="96" text-anchor="middle" font-weight="400">(current flows through it)</text>
        <text x="356" y="112" fill="${BL}">Voltmeter:</text>
        <text x="356" y="128" fill="${BL}">ACROSS the</text>
        <text x="356" y="144" fill="${BL}">resistor</text>
      </g>`, 440);
  }

  function ledDiagram(){
    return S('0 0 380 214', `
      <path d="M70 110 L70 60 A30 30 0 0 1 130 60 L130 110 Z" fill="#ff4d4d" fill-opacity=".85" stroke="#b91c1c" stroke-width="2"/>
      <rect x="62" y="108" width="76" height="10" rx="2" fill="#ff6b6b" stroke="#b91c1c" stroke-width="2"/>
      <line x1="136" y1="108" x2="136" y2="118" stroke="#7f1d1d" stroke-width="3"/>
      <line x1="85" y1="118" x2="85" y2="200" stroke="#9aa1ad" stroke-width="4"/>
      <line x1="115" y1="118" x2="115" y2="172" stroke="#9aa1ad" stroke-width="4"/>
      <g font-size="13" font-weight="600" fill="#172033">
        <text x="14" y="196">Long leg</text><text x="14" y="210" font-size="12" font-weight="700" fill="#b91c1c">+ (anode)</text>
        <line x1="60" y1="190" x2="82" y2="190" stroke="#5a6679"/>
        <line x1="118" y1="168" x2="160" y2="168" stroke="#5a6679"/><text x="164" y="164">Short leg</text><text x="164" y="179" font-size="12" font-weight="700">− (cathode)</text>
        <line x1="138" y1="112" x2="160" y2="112" stroke="#5a6679"/><text x="164" y="108">Flat edge</text><text x="164" y="123" font-size="12" font-weight="400">marks the − side</text>
      </g>
      <g transform="translate(262,8)"><g fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="scale(.9)">${sym.led}</g><text x="54" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#172033">LED symbol</text><text x="54" y="86" text-anchor="middle" font-size="11" fill="#5a6679">current flows →</text></g>
    `, 380);
  }

  const boltIcon = (w, fill) => S('0 0 24 24', `<path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="${fill||'#ffc53d'}" stroke="#7a5200" stroke-width="1" stroke-linejoin="round"/>`, w||24);

  function seal(){
    let pts=''; const n=24;
    for(let i=0;i<n*2;i++){ const a=Math.PI*i/n; const r=i%2?40:46; pts+=`${50+r*Math.cos(a)},${50+r*Math.sin(a)} `; }
    return S('0 0 100 100', `<polygon points="${pts}" fill="#c9a227"/><circle cx="50" cy="50" r="35" fill="#1d3a8a" stroke="#f5e39a" stroke-width="2"/><path d="M53 26 38 54h11l-3 20 17-29H52z" fill="#ffc53d" stroke="#7a5200" stroke-width="1"/>`, 100);
  }

  return { symbol, symbolChart, setup, bulbDiagram, wireCross, schematicLoop, meterSchematic, ledDiagram, boltIcon, seal, battery, bulb, defs, sym };
})();

  goals: ['Explain what electric current is', 'Tell conductors from insulators', 'Build complete circuits and read schematics', 'Measure voltage, current, and resistance with meters'],
  sections: [

  /* ---------------- 1.1 ---------------- */
  { id:'p1s1', title:'What Is Electricity?', minutes:9, blocks:[
    { type:'callout', kind:'goal', title:'In Part 1 you will…', html:'<ul style="margin:0"><li>Learn what electricity really is</li><li>Build circuits and find out what makes them work (or fail)</li><li>Measure circuits with the same tools engineers use</li></ul>' },
    { type:'html', html:'<p class="lead">Every robot you will ever build runs on electricity. Before we can make a robot move, blink, or beep, we need to understand what electricity actually is.</p>' },
    { type:'h3', text:'Tiny particles with a charge' },
    { type:'html', html:'<p>Everything around you is made of <b>atoms</b>. Atoms are made of even smaller particles:</p><ul><li><b>Protons</b> have a <b>positive (+)</b> charge.</li><li><b>Neutrons</b> have <b>no</b> charge.</li><li><b>Electrons</b> have a <b>negative (−)</b> charge.</li></ul><p>In metals, some electrons are only loosely held by their atoms. These <b>free electrons</b> can hop from atom to atom. When lots of free electrons move in the same direction, we get an <b>electric current</b>.</p>' },
    { type:'figure', svg: G.wireCross(), caption:'Inside a wire: free electrons (blue dots) drift through the copper metal.' },
    { type:'vocab', items:[
      { icon:'⚡', term:'Electric charge', def:'A property of tiny particles. Electrons are negative (−) and protons are positive (+).' },
      { icon:'🔵', term:'Electron', def:'A tiny negative particle. Free electrons in metals are what move to make electricity.' },
      { icon:'➡️', term:'Electric current', def:'The <b>flow of electric charge</b> through a material. It is measured in <b>amps (A)</b>.' }
    ]},
    { type:'callout', kind:'fact', title:'Wait… electrons are slow?', html:'<p>Electrons in a wire actually drift very slowly, often less than a millimeter per second! So why does a light turn on the instant you flip the switch? Because the wire is <b>already full</b> of electrons. When the battery pushes electrons in at one end, electrons all along the wire start moving at once. Try it with the marble model below.</p>' },
    { type:'widget', id:'p1-marbles', widget:'marbleTube', icon:'🔵', title:'Marble Model of a Wire', tasks:[ {id:'push3', text:'Push 3 marbles into the tube. Watch what happens at the far end, and watch how far the yellow marble moves.'} ] },
    { type:'mc', id:'p1-mc-marble', q:'In the marble model, when you pushed one marble in, what happened?', choices:[
      'One marble popped out the other end right away, even though each marble only moved one space',
      'Nothing happened until the marble rolled all the way through the tube',
      'All the marbles shot out of the tube at once',
      'The marbles moved backward'
    ], answer:0, explain:'The tube was already full, so a push at one end moves every marble a little, and one pops out immediately. A wire full of electrons works the same way, which is why lights turn on instantly.' },
    { type:'mc', id:'p1-mc-current', q:'What is electric current?', choices:[
      'The flow of electric charge through a material',
      'The amount of energy stored in a battery',
      'The heat given off by a wire',
      'A type of metal used to make wires'
    ], answer:0, why:[null,'A battery stores energy, but current is about charge that is <i>moving</i>.','Wires can get warm, but heat is not the same thing as current.','Copper is a metal used in wires, but it is not current itself.'], explain:'Current is moving charge. In a wire, that means free electrons flowing in the same direction.' },

    { type:'h3', text:'Conductors and insulators' },
    { type:'html', html:'<p>Some materials let electric charge flow through them easily. These are called <b>conductors</b>. Most metals, like copper, aluminum, silver, and steel, are great conductors.</p><p>Other materials block the flow of charge. These are called <b>insulators</b>. Plastic, rubber, glass, dry wood, and air are insulators.</p><p>Look closely at any wire. Shiny copper metal (a conductor) is on the inside, and colorful plastic (an insulator) is on the outside. The copper carries the current. The plastic keeps the current from escaping, and keeps it away from your fingers!</p>' },
    { type:'sort', id:'p1-sort', q:'Sort each object. Is it a <b>conductor</b> or an <b>insulator</b>?', bins:['Conductor','Insulator'], items:[
      { emoji:'🟠', label:'Bare copper wire', bin:'Conductor', why:'Copper is the most common metal used in wires.', hint:'What metal is inside almost every wire?' },
      { emoji:'📎', label:'Steel paper clip', bin:'Conductor', why:'Steel is a metal, so charge flows through it.', hint:'Is it made of metal?' },
      { emoji:'➰', label:'Rubber band', bin:'Insulator', why:'Rubber blocks current. That is why tool handles and electricians’ gloves use rubber.', hint:'Why do electricians wear rubber gloves?' },
      { emoji:'🪙', label:'Coin', bin:'Conductor', why:'Coins are made of metals like copper and nickel.', hint:'What are coins made of?' },
      { emoji:'📏', label:'Plastic ruler', bin:'Insulator', why:'Plastic blocks the flow of charge. It is the coating on wires.', hint:'What is the outside of a wire made of?' },
      { emoji:'✏️', label:'Pencil “lead” (graphite)', bin:'Conductor', why:'Surprise! Pencil “lead” is really graphite, a form of carbon that conducts electricity.', hint:'Pencil “lead” is really graphite, a form of carbon. Carbon is a surprise conductor!' },
      { emoji:'🪵', label:'Wooden craft stick', bin:'Insulator', why:'Dry wood is an insulator.', hint:'Is dry wood a metal?' },
      { emoji:'🖨️', label:'Your 3D-printed PLA part', bin:'Insulator', why:'PLA is a plastic, so it is an insulator. That is why 3D-printed cases are great for protecting circuits!', hint:'What kind of material is PLA filament?' }
    ], explain:'Metals (and graphite) are conductors. Plastics, rubber, and wood are insulators.' },
    { type:'mc', id:'p1-mc-coat', q:'Why is the copper inside a wire covered with plastic?', choices:[

    ], answer:0, explain:'The plastic coating is an insulator. It keeps current on its path and keeps it from reaching you or other wires.' }

  /* ---------------- 1.2 ---------------- */
  { id:'p1s2', title:'The Parts of a Circuit', minutes:11, blocks:[
    { type:'html', html:'<p class="lead">A <b>circuit</b> is a complete loop that electric charge can flow around. The word comes from “circle”: the path has to go all the way around and come back to where it started.</p><p>Almost every circuit has these four parts:</p>' },
    { type:'vocab', items:[
      { icon:'🔋', term:'Energy source', def:'Pushes the charge around the loop. Example: a <b>battery</b>. A battery has two ends called <b>terminals</b>: positive (+) and negative (−).' },
      { icon:'〰️', term:'Conductor (path)', def:'Carries the charge from one part to the next. Example: <b>wires</b>.' },
      { icon:'💡', term:'Load', def:'A device that <b>uses</b> electrical energy to do a job. Examples: a light bulb, motor, buzzer, or LED.' },
      { icon:'🔘', term:'Switch', def:'Opens or closes the loop to turn the circuit off or on.' }
    ]},
    { type:'h3', text:'Open vs. closed circuits' },
    { type:'html', html:'<p>When the loop is complete, it is called a <b>closed circuit</b>. Charge flows, and the bulb lights up.</p><p>When there is a gap anywhere in the loop, it is called an <b>open circuit</b>. Charge stops flowing <i>everywhere</i> in the loop, and the bulb goes dark. A switch works by making a gap on purpose.</p>' },
    { type:'callout', kind:'tip', title:'Memory trick', html:'<p><b>Closed = complete = current flows.</b> Open = gap = no flow. It feels backwards compared to a door: a closed door blocks you, but a closed switch lets current through.</p>' },
    { type:'widget', id:'p1-play', widget:'circuitPlayground', icon:'💡', title:'Circuit Playground', tasks:[
      { id:'on', text:'Close the switch so the bulb turns on. (Click the switch or use the button.)' },
      { id:'off', text:'Open the switch to turn the bulb off.' },

    { type:'mc', id:'p1-mc-cut', q:'When you cut the bottom wire, what happened to the moving electrons?', choices:[

      'They kept moving, but the bulb turned off'
    ], answer:0, why:[null,'Look again: did any electrons keep moving?','Look again: did any electrons keep moving?','Without a complete loop, can charge keep flowing?'], explain:'A circuit needs a complete loop. A gap anywhere stops the flow everywhere.' },
    { type:'h3', text:'Circuit symbols' },
    { type:'html', html:'<p>Engineers don’t draw realistic pictures of batteries and bulbs. They use simple symbols instead. A drawing made with circuit symbols is called a <b>schematic</b> (say it: skee-MAT-ik). You will see schematics in almost every micro:bit and Arduino project.</p>' },
    { type:'figure', svg: G.symbolChart(), frame:false, caption:'Common circuit symbols' },
    { type:'match', id:'p1-match-sym', q:'Match each symbol to its name. (Try it without scrolling up!)', rows:[

      { left: G.symbol('led',110), answer:'LED' },

    { type:'mc', id:'p1-mc-schem', q:'Look at this schematic. Will the bulb be lit?', figure: G.schematicLoop({closed:false}), choices:[
      'No, the switch is open, so there is a gap in the loop',

    ], answer:0, explain:'The switch symbol is drawn open (tilted up). That makes a gap, so it is an open circuit and no current flows.' }
  ]},

  /* ---------------- 1.3 ---------------- */
  { id:'p1s3', title:'Will It Light?', minutes:8, blocks:[
    { type:'html', html:'<p class="lead">Time to be an electrical detective. To light up, a bulb needs charge to flow <b>through</b> it: in one contact and out the other.</p><p>A light bulb has <b>two</b> metal contact points: the <b>side</b> (the metal screw part) and the <b>tip</b> on the very bottom. Inside the glass, a thin wire called the <b>filament</b> connects those two points. When current flows through the filament, it gets so hot that it glows.</p>' },
    { type:'figure', svg: G.bulbDiagram(), caption:'Current enters one contact, travels through the filament, and leaves through the other contact.' },
    { type:'callout', kind:'key', title:'The rule', html:'<p>A bulb lights <b>only</b> when there is a complete loop: from one end of the battery, <b>into</b> one contact of the bulb, <b>through</b> the filament, <b>out</b> the other contact, and back to the <b>other</b> end of the battery.</p>' },
    { type:'html', html:'<p><b>Predict:</b> For each setup, decide if the bulb will light. The battery is a normal 1.5-volt cell with + on top and − on the bottom. The bulb will glow in the picture once you get it right.</p>' },
    { type:'mc', id:'p1-wil-a', label:'Setup A', q:'Will the bulb light?', figure:G.setup('A'), choices:['Yes, it lights','No, it stays dark'], answer:0, why:[null,'Trace the path: tip touches +, then filament, then side contact, then the wire goes to −. Is anything missing?'], explain:'The tip touches the + end. Current goes through the filament, out the side contact, and through the wire to the − end. Complete loop!' },
    { type:'mc', id:'p1-wil-b', label:'Setup B', q:'Will the bulb light?', figure:G.setup('B'), choices:['Yes, it lights','No, it stays dark'], answer:1, why:['Touching the battery isn’t enough. Where does the current go after it leaves the bulb’s side contact?'], explain:'Only the tip touches the battery. There is no path from the side contact back to the − end, so there is no loop.' },
    { type:'mc', id:'p1-wil-c', label:'Setup C', q:'Will the bulb light?', figure:G.setup('C'), choices:['Yes, it lights','No, it stays dark'], answer:0, why:[null,'The bulb doesn’t have to touch the battery. Trace the red wire and the black wire. Do they connect to different contacts?'], explain:'The red wire goes from + to the tip. The black wire goes from the side contact to −. Current flows through the filament. Complete loop!' },
    { type:'mc', id:'p1-wil-d', label:'Setup D', q:'Will the bulb light?', figure:G.setup('D'), choices:['Yes, it lights','No, it stays dark'], answer:1, why:['Look closely: which contact does each wire touch? Does current have to go through the filament?'], explain:'Both wires touch the <b>same</b> contact (the tip). Charge takes a shortcut from one wire to the other and never goes through the filament. This is a <b>short circuit</b>, and the battery would get warm!' },
    { type:'mc', id:'p1-wil-e', label:'Setup E', q:'Will the bulb light?', figure:G.setup('E'), choices:['Yes, it lights','No, it stays dark'], answer:1, why:['Where do the two wires connect on the battery? Is there a path to the − end?'], explain:'Both wires connect to the <b>+</b> end of the battery. Nothing connects to the − end, so there is no loop.' },
    { type:'short', id:'p1-short-light', q:'In your own words, explain what a bulb needs in order to light up. Use the words <i>loop</i>, <i>contact</i>, and <i>battery</i>.', minWords:12, sample:'A bulb needs a complete loop. Current has to leave one end of the battery, go into one contact of the bulb, flow through the filament, come out the other contact, and return to the other end of the battery.', check:'Did you say the loop must be complete, and that the current goes in one contact and out the other?' }
  ]},

  /* ---------------- 1.4 ---------------- */
  { id:'p1s4', title:'Build It in the Circuit Lab', minutes:12, blocks:[
    { type:'html', html:'<p class="lead">Now you will build circuits in a simulation from PhET at the University of Colorado. The parts act like real electricity, but nothing can catch fire in real life. (It might in the sim! 🔥)</p>' },
    { type:'h3', text:'How to use the simulator' },
    { type:'steps', items:[
      'Click <b>Load the simulation</b>, then choose the <b>Intro</b> screen.',
      'Drag parts from the box on the left into the big work area.',
      'Connect parts by dragging the <b>end</b> of one part onto the end of another. The ends snap together.',

    { type:'sim', title:'Circuit Construction Kit: DC', src: PHET.cck },
    { type:'h3', text:'Challenge 1: Light the bulb' },
    { type:'html', html:'<p>Use <b>1 battery</b>, <b>1 light bulb</b>, and <b>2 wires</b> to make the bulb light up. Then watch the blue dots moving through your circuit.</p>' },
    { type:'mc', id:'p1-sim-dots', q:'What do the moving blue dots represent?', choices:['Electrons (negative charges) flowing through the circuit','Heat moving through the wires','Light traveling to the bulb','Air bubbles in the wire'], answer:0, explain:'The sim shows electrons flowing. They exist in every wire all the time. A battery just gets them moving.' },
    { type:'mc', id:'p1-sim-dir', q:'Look closely at the battery. The electrons flow <b>out of</b> which end of the battery?', choices:['Out of the negative (−) end, and back into the positive (+) end','Out of the positive (+) end, and back into the negative (−) end','Out of both ends, meeting in the middle of the bulb','They never go through the battery'], answer:0, explain:'Electrons are negative, so they are pushed away from the − end and pulled toward the + end.' },
    { type:'callout', kind:'fact', title:'Conventional current', html:'<p>Long before anyone knew about electrons, scientists guessed that current flowed from <b>+ to −</b>. Engineers still draw it that way. It’s called <b>conventional current</b>. In the sim, you can switch between <b>Electrons</b> and <b>Conventional</b> in the menu on the right. Both describe the same circuit; the arrows just point in opposite directions.</p>' },
    { type:'h3', text:'Challenge 2: Add a switch' },
    { type:'html', html:'<p>Add a <b>switch</b> into your loop (it’s in the parts box). Click the switch to open and close it.</p>' },
    { type:'mc', id:'p1-sim-switch', q:'When the switch is open, what happens?', choices:['The electrons stop moving everywhere, and the bulb goes out','The electrons stop only between the switch and the battery','The bulb gets brighter','The electrons move backward'], answer:0, explain:'An open switch makes a gap. With no complete loop, the flow stops everywhere at once.' },
    { type:'h3', text:'Challenge 3: Brightness' },
    { type:'html', html:'<p>Click the <b>battery</b> and slide its voltage up and down. Then click the <b>light bulb</b> and change its resistance. Watch the brightness and the speed of the electrons.</p>' },
    { type:'mc', id:'p1-sim-volt', q:'How does changing the battery’s voltage affect the bulb?', choices:['More voltage makes the bulb brighter and the electrons faster','More voltage makes the bulb dimmer','Voltage has no effect on the bulb','More voltage makes the electrons stop'], answer:0, explain:'Voltage is the push. A bigger push makes more current flow, so the bulb is brighter.' },
    { type:'mc', id:'p1-sim-res', q:'With the same battery, what happens when you increase the bulb’s resistance?', choices:['The bulb gets dimmer and the electrons slow down','The bulb gets brighter','Nothing changes','The battery voltage goes up'], answer:0, explain:'Resistance fights the flow. More resistance means less current, so the bulb is dimmer.' },
    { type:'h3', text:'Challenge 4: Test everyday objects' },
    { type:'steps', items:[
      'Click the <b>Lab</b> screen button at the bottom of the sim.',
      'Build a circuit with a battery, a light bulb, and wires, but leave a <b>gap</b> in the loop.',
      'Scroll down in the parts box to find everyday objects (coin, paper clip, pencil, eraser, dollar bill, hand, and more).',
      'Drag each object into the gap so it completes the loop. Does the bulb light?'
    ]},
    { type:'record', id:'p1-rec-objects', q:'Record what happened for each object.', colA:'Object', colB:'What happened to the bulb?', rows:['🪙 Coin','📎 Paper clip','✏️ Pencil','🧽 Eraser','💵 Dollar bill','✋ Hand'], options:['Lit up brightly','Lit up dimly','Did not light'], explain:'Data saved! Now use it to answer the next question.' },
    { type:'mc', id:'p1-sim-obj', q:'Based on your tests, which two objects are the best conductors?', choices:['The coin and the paper clip','The eraser and the dollar bill','The hand and the eraser','All of the objects conduct equally well'], answer:0, explain:'The coin and paper clip are metal, so they are excellent conductors. The pencil (graphite) conducts a little. The eraser and dollar bill are insulators.' }
  ]},

  /* ---------------- 1.5 ---------------- */
  { id:'p1s5', title:'Voltage, Current & Resistance', minutes:9, blocks:[
    { type:'html', html:'<p class="lead">Three measurements describe every circuit. Let’s meet them using a model that’s easier to picture: water flowing through pipes.</p>' },
    { type:'html', html:`<div class="big3">
      <div class="b b-v"><h4>⚡ Voltage (V)</h4><span class="unit">Unit: volts (V) · Tool: voltmeter</span><p>The <b>push</b> that makes charge move. A battery creates voltage.</p><p><b>Water model:</b> the pump’s pressure, or how hard the water is pushed.</p><p class="small">AA battery = 1.5 V · micro:bit = about 3 V · Arduino = 5 V · wall outlet = 120 V (dangerous!)</p></div>
      <div class="b b-i"><h4>➡️ Current (I)</h4><span class="unit">Unit: amperes / amps (A) · Tool: ammeter</span><p>How much charge <b>flows</b> past a point each second.</p><p><b>Water model:</b> how much water flows through the pipe each second.</p><p class="small">Why the letter I? It comes from the French word <i>intensité</i> (intensity).</p></div>
      <div class="b b-r"><h4>🚧 Resistance (R)</h4><span class="unit">Unit: ohms (Ω) · Parts: resistors</span><p>How much something <b>opposes</b> (fights) the flow of charge.</p><p><b>Water model:</b> a narrow or clogged section of pipe.</p><p class="small">Ω is the Greek letter omega. <b>Resistors</b> are parts made to add a set amount of resistance.</p></div>
    </div>` },
    { type:'widget', id:'p1-water', widget:'waterModel', icon:'💧', title:'Water Pipe Model', tasks:[
      { id:'fast', text:'Make the water flow as <b>fast</b> as possible.' },
      { id:'slow', text:'Make the water flow as <b>slow</b> as possible.' },
      { id:'two', text:'Find <b>two different</b> combinations of settings that both give a flow of exactly <b>2</b>.' }
    ]},
    { type:'callout', kind:'key', title:'The big idea', html:'<p><b>More push (voltage) → more flow (current).</b><br><b>More resistance → less flow (current).</b></p>' },
    { type:'match', id:'p1-match-vir', q:'Complete the table. Which quantity does each clue describe?', rows:[
      { left:'The <b>push</b> that moves charge', answer:'Voltage' },
      { left:'The amount of charge <b>flowing</b> each second', answer:'Current' },
      { left:'How much a part <b>opposes</b> the flow', answer:'Resistance' },
      { left:'Measured in <b>volts (V)</b>', answer:'Voltage' },
      { left:'Measured in <b>amps (A)</b>', answer:'Current' },
      { left:'Measured in <b>ohms (Ω)</b>', answer:'Resistance' },
      { left:'Measured with an <b>ammeter</b>', answer:'Current' },
      { left:'Measured with a <b>voltmeter</b>', answer:'Voltage' },
      { left:'Like a <b>narrow pipe</b> in the water model', answer:'Resistance' }
    ], options:['Voltage','Current','Resistance'], shuffleOptions:false, explain:'You know the big three!' },
    { type:'mc', id:'p1-mc-9v', q:'A battery is labeled <b>9 V</b>. What does the 9 V tell you?', choices:['How hard the battery pushes charge (its voltage)','How much current it always makes','Its resistance','How many hours it will last'], answer:0, explain:'Volts measure the push. The current depends on what you connect to the battery.' },
    { type:'mc', id:'p1-mc-letter', q:'In circuit formulas, which letter stands for <b>current</b>?', choices:['I','C','A','V'], answer:0, why:[null,'Tricky! C is not used for current. Think French…','A is the unit (amps), not the letter for the quantity.','V is for voltage.'], explain:'Current uses the letter I, from the French word <i>intensité</i>. Its unit is the amp (A).' }
  ]},

  /* ---------------- 1.6 ---------------- */
  { id:'p1s6', title:'Measure It with Meters', minutes:13, blocks:[
    { type:'html', html:'<p class="lead">Engineers don’t guess, they <b>measure</b>. The two most important tools are the <b>voltmeter</b> and the <b>ammeter</b>.</p>' },
    { type:'html', html:`<div class="big3">
      <div class="b b-v"><h4>Voltmeter</h4><p>Measures <b>voltage</b> (the push) between two points. Touch one probe to each side of the part you want to measure. We say a voltmeter goes <b>across</b> a part.</p><p class="small">Tip: put the red probe on the side closest to the battery’s + end.</p></div>
      <div class="b b-i"><h4>Ammeter</h4><p>Measures <b>current</b> (the flow) in a wire. In real life, the current must flow <b>through</b> the ammeter, so it goes <b>in the path</b>. In this sim, you can simply place the ammeter’s crosshair right on top of a wire.</p></div>
    </div>` },
    { type:'figure', svg: G.meterSchematic(), caption:'Schematic: the ammeter (A) is in the path. The voltmeter (V) is connected across the resistor.' },
    { type:'sim', title:'Circuit Construction Kit: DC', src: PHET.cck },
    { type:'h3', text:'Set up your circuit' },
    { type:'steps', items:[
      'Use the <b>Intro</b> screen. Build a loop with <b>1 battery</b> and <b>1 resistor</b> (the striped part).',
      'Click the battery and set it to <b>9.0 V</b>. Click the resistor and set it to <b>10 Ω</b>.',
      'Check <b>Values</b> in the menu on the right to show the numbers on each part.',

    { type:'mc', id:'p1-m-same', q:'Move the ammeter to several different wires around the loop. What do you notice?', choices:['The current is the same everywhere in the loop','The current is biggest right after the battery','The current gets used up, so it is smallest at the end','The current is zero on some wires'], answer:0, why:[null,'Check a few more wires. Do the numbers change?','This is a very common idea, but test it! Is the number smaller after the resistor?','Only if something is broken. Check your connections.'], explain:'Current is <b>not</b> used up! In a single loop, the same amount of charge flows past every point. What the resistor uses up is <b>energy</b>, not charge.' },
    { type:'h3', text:'Investigate: change the resistance' },

    { type:'num', id:'p1-m-i30', q:'Change the resistor to <b>30 Ω</b>. What is the current now?', answer:0.3, unit:'A', hint:'Click the resistor and move its slider to 30 Ω.', explain:'Three times the resistance means one-third of the current: 0.30 A.' },
    { type:'mc', id:'p1-m-trend', q:'When the resistance went up, the current…', choices:['went down','went up','stayed the same','dropped to zero'], answer:0, explain:'More resistance fights the flow more, so less current flows.' },

    { type:'h3', text:'Challenge: two batteries' },

      material: { name:'Conductors & insulators', section:'p1s1', review:'<p><b>Conductors</b> let charge flow easily: metals like copper, steel, and aluminum (and graphite). <b>Insulators</b> block charge: plastic (including PLA), rubber, glass, and dry wood. Wires have a conductor inside and an insulator outside.</p>' },
      parts:    { name:'Circuit parts & open/closed circuits', section:'p1s2', review:'<p>A circuit needs an <b>energy source</b> (battery), a <b>path</b> (wires), and a <b>load</b> (bulb, motor, LED). A <b>switch</b> opens or closes the loop. <b>Closed</b> = complete loop = current flows. <b>Open</b> = a gap anywhere = no current anywhere.</p>' },

      { id:'s3', topic:'symbols', q:'What does this schematic symbol stand for?', figure:G.symbol('bulb',150), choices:['Light bulb','Switch','Resistor','Battery'], answer:0, explain:'A circle with an X inside is a light bulb (lamp).' },
      { id:'l1', topic:'light', q:'Will this bulb light?', figure:G.setup('B'), choices:['No, there is no path from the bulb back to the battery','Yes, touching the battery is enough','Yes, but only dimly','No, because the battery is upside down'], answer:0, explain:'Only one contact touches the battery. There is no loop.' },
      { id:'l2', topic:'light', q:'Will this bulb light?', figure:G.setup('D'), choices:['No, both wires touch the same contact, so current skips the filament','Yes, two wires make it extra bright','Yes, it is a complete loop through the filament','No, the wires need to be the same color'], answer:0, explain:'Both wires are on the tip. The current takes a shortcut (a short circuit) and never goes through the filament.' },
      { id:'l3', topic:'light', q:'Will this bulb light?', figure:G.setup('C'), choices:['Yes, there is a complete loop through the filament','No, the bulb must touch the battery','No, you need three wires','Only if you add a switch'], answer:0, explain:'+ → tip → filament → side → −. Complete loop!' },
      { id:'v1', topic:'vir', q:'Which unit measures <b>voltage</b>?', choices:['Volts (V)','Amps (A)','Ohms (Ω)','Meters (m)'], answer:0, explain:'Voltage is measured in volts.' },

      { id:'v4', topic:'vir', q:'<b>Current</b> is measured in…', choices:['amperes (amps)','volts','ohms','meters per second'], answer:0, explain:'Current is measured in amps (A).' },
      { id:'v5', topic:'vir', q:'If the resistance in a circuit <b>increases</b> and the voltage stays the same, the current will…', choices:['decrease','increase','stay the same','switch direction'], answer:0, explain:'More resistance means less current.' },
      { id:'e1', topic:'meters', q:'Which tool measures <b>current</b>?', choices:['An ammeter','A voltmeter','A thermometer','A stopwatch'], answer:0, explain:'AMmeter measures AMps.' },
      { id:'e2', topic:'meters', q:'How do you connect a voltmeter to measure the voltage of a bulb?', choices:['Touch one probe to each side of the bulb (across it)','Touch both probes to the same spot on one wire','Replace the bulb with the voltmeter','Touch one probe to the battery and hold the other in the air'], answer:0, explain:'A voltmeter measures the difference in push between two points, so it goes across the part.' },
