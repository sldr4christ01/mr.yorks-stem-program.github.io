<script>
/* ============ Part 2 content ============ */
window.PARTS.push({
  id: 'p2', num: 2, color: '#0f9c9a', minutes: 60,
  title: 'Ohm’s Law & Circuit Types',
  subtitle: 'Calculate with V = I × R, compare series and parallel circuits, and get ready for smart circuits.',
  certTitle: 'Part 2: Ohm’s Law & Circuit Types',
  certSub: 'Ohm’s Law, series & parallel circuits, short circuits, and LED resistors',
  goals: ['Use Ohm’s Law (V = I × R) to calculate', 'Compare series and parallel circuits', 'Explain short circuits and stay safe', 'Choose the right resistor for an LED'],
  sections: [

  /* ---------------- 2.1 ---------------- */
  { id:'p2s1', title:'Quick Recap: Circuit Basics', minutes:5, blocks:[
    { type:'callout', kind:'goal', title:'In Part 2 you will…', html:'<ul style="margin:0"><li>Discover and use <b>Ohm’s Law</b></li><li>Compare <b>series</b> and <b>parallel</b> circuits</li><li>Learn why <b>short circuits</b> are dangerous</li><li>Pick the right resistor to protect an <b>LED</b> for your micro:bit or Arduino</li></ul>' },
    { type:'html', html:'<p class="lead">Welcome to Part 2! Whether you finished Part 1 yesterday or haven’t started it yet, here are the big ideas you’ll need today.</p>' },
    { type:'vocab', items:[
      { icon:'⭕', term:'Circuit', def:'A complete loop that electric charge can flow around. <b>Closed</b> = complete (current flows). <b>Open</b> = there’s a gap (no current anywhere).' },
      { icon:'⚡', term:'Voltage (V)', def:'The <b>push</b> that moves charge. Measured in <b>volts (V)</b>. A battery provides voltage.' },
      { icon:'➡️', term:'Current (I)', def:'The <b>flow</b> of charge. Measured in <b>amps (A)</b>. In wires, it is electrons moving.' },
      { icon:'🚧', term:'Resistance (R)', def:'How much a part <b>opposes</b> the flow. Measured in <b>ohms (Ω)</b>. Resistors add resistance.' },
      { icon:'🟠', term:'Conductors & insulators', def:'Conductors (metals) let charge flow. Insulators (plastic, rubber) block it.' },
      { icon:'📏', term:'Meters', def:'A <b>voltmeter</b> measures voltage <b>across</b> a part. An <b>ammeter</b> measures current <b>in the path</b>.' }
    ]},
    { type:'callout', kind:'key', title:'Water model', html:'<p>Think of a circuit like water in pipes: the <b>pump</b> is the battery (voltage), the <b>water flow</b> is the current, and a <b>narrow pipe</b> is a resistor (resistance). More push → more flow. Narrower pipe → less flow.</p>' },
    { type:'mc', id:'p2-w1', label:'Warm-up', q:'Which quantity is the <b>push</b> that moves charge through a circuit?', choices:['Voltage','Current','Resistance','Conductance'], answer:0, explain:'Voltage is the push. A battery supplies it.' },
    { type:'mc', id:'p2-w2', label:'Warm-up', q:'Current is measured in…', choices:['amps (A)','volts (V)','ohms (Ω)','watts (W)'], answer:0, explain:'Current is measured in amps (A).' },
    { type:'mc', id:'p2-w3', label:'Warm-up', q:'If you add more resistance to a circuit (same battery), the current will…', choices:['decrease','increase','stay the same','double'], answer:0, explain:'Resistance fights the flow, so current goes down.' }
  ]},

  /* ---------------- 2.2 ---------------- */
  { id:'p2s2', title:'Discover Ohm’s Law', minutes:10, blocks:[
    { type:'html', html:'<p class="lead">In 1827, a German scientist named <b>Georg Ohm</b> discovered a simple rule that connects voltage, current, and resistance. Now you’ll rediscover it.</p><p>The simulation below shows the equation <b>V = I × R</b>. The letters grow and shrink to show how big each value is. You control <b>V</b> (voltage) and <b>R</b> (resistance) with the sliders, and the sim shows the current <b>I</b>.</p>' },
    { type:'callout', kind:'tip', title:'Milliamps (mA)', html:'<p>This sim shows current in <b>milliamps (mA)</b>. “Milli” means one-thousandth. <b>1 A = 1000 mA</b>, so 25 mA = 0.025 A. Small circuits, like micro:bit and Arduino projects, use currents measured in milliamps.</p>' },
    { type:'sim', title:'Ohm’s Law', src: PHET.ohm },
    { type:'callout', kind:'tip', title:'Getting exact values', html:'<p>Click a slider, then use the <b>arrow keys</b> on your keyboard to move it one step at a time.</p>' },
    { type:'mc', id:'p2-o-v', q:'Slide the voltage (<b>V</b>) up while keeping <b>R</b> the same. What happens to the current (<b>I</b>)?', choices:['The current increases','The current decreases','The current stays the same','The current drops to zero'], answer:0, explain:'More push means more flow. V and I go up and down together.' },
    { type:'mc', id:'p2-o-r', q:'Now slide the resistance (<b>R</b>) up while keeping <b>V</b> the same. What happens to <b>I</b>?', choices:['The current decreases','The current increases','The current stays the same','The voltage changes by itself'], answer:0, explain:'More resistance means less flow. When R goes up, I goes down.' },
    { type:'num', id:'p2-o-n1', q:'Set <b>V = 6.0 V</b> and <b>R = 500 Ω</b>. What current does the sim show?', answer:12, unit:'mA', hint:'Read the current (I) in the sim. It is shown in mA.', explain:'I = 12 mA. (Check: 6 ÷ 500 = 0.012 A = 12 mA.)' },
    { type:'num', id:'p2-o-n2', q:'Set <b>V = 9.0 V</b> and <b>R = 100 Ω</b>. What current does the sim show?', answer:90, unit:'mA', hint:'Move R all the way down to 100 Ω, and V up to 9.0 V.', explain:'I = 90 mA. (Check: 9 ÷ 100 = 0.09 A = 90 mA.)' },
    { type:'num', id:'p2-o-n3', q:'Set <b>V = 3.0 V</b> and <b>R = 1000 Ω</b>. What current does the sim show?', answer:3, unit:'mA', hint:'Move R all the way up to 1000 Ω.', explain:'I = 3.0 mA. (Check: 3 ÷ 1000 = 0.003 A = 3 mA.)' },
    { type:'mc', id:'p2-o-rule', q:'Look at your three results. Which rule gives the current every time?', choices:['Current = voltage ÷ resistance','Current = voltage × resistance','Current = voltage + resistance','Current = resistance ÷ voltage'], answer:0, why:[null,'Try it: 6 × 500 = 3000. Is that the current the sim showed?','Try it: 6 + 500 = 506. Is that the current the sim showed?','Try it: 500 ÷ 6 ≈ 83. Is that what the sim showed?'], explain:'I = V ÷ R. That is Ohm’s Law!' },
    { type:'short', id:'p2-o-words', q:'Explain the relationship between voltage, current, and resistance as if you were teaching a friend who missed class.', minWords:15, sample:'Voltage is the push and current is the flow. If you push harder (more voltage), more current flows. Resistance fights the flow, so if you add more resistance, less current flows. Ohm’s Law says current = voltage ÷ resistance.', check:'Did you explain what happens to current when voltage goes up AND when resistance goes up?' }
  ]},

  /* ---------------- 2.3 ---------------- */
  { id:'p2s3', title:'Using Ohm’s Law: V = I × R', minutes:13, blocks:[
    { type:'html', html:'<p class="lead">Ohm’s Law is usually written like this:</p><div class="formula">V = I × R</div><p class="center muted">V = voltage in volts (V) &nbsp;·&nbsp; I = current in amps (A) &nbsp;·&nbsp; R = resistance in ohms (Ω)</p><p>If you know any <b>two</b> of the values, you can find the third:</p>' },
    { type:'html', html:'<div class="formula-cards"><div>To find <b>voltage</b><b>V = I × R</b></div><div>To find <b>current</b><b>I = V ÷ R</b></div><div>To find <b>resistance</b><b>R = V ÷ I</b></div></div>' },
    { type:'widget', id:'p2-tri', widget:'ohmTriangle', icon:'🔺', title:'The Ohm’s Law Triangle', tasks:[
      { id:'cV', text:'Cover <b>V</b> to see how to find voltage.' },
      { id:'cI', text:'Cover <b>I</b> to see how to find current.' },
      { id:'cR', text:'Cover <b>R</b> to see how to find resistance.' }
    ]},
    { type:'h3', text:'Worked examples' },
    { type:'html', html:`
      <div class="example"><div class="ex-t">Example 1: Find the current</div><table>
        <tr><td>Problem</td><td>A flashlight has a <b>3 V</b> battery and a bulb with <b>6 Ω</b> of resistance. How much current flows?</td></tr>
        <tr><td>Know</td><td>V = 3 V, R = 6 Ω</td></tr><tr><td>Find</td><td>I</td></tr>
        <tr><td>Formula</td><td>I = V ÷ R</td></tr><tr><td>Solve</td><td>I = 3 ÷ 6 = <b>0.5 A</b></td></tr></table></div>
      <div class="example"><div class="ex-t">Example 2: Find the voltage</div><table>
        <tr><td>Problem</td><td>A robot’s motor has <b>4.5 Ω</b> of resistance and needs <b>2 A</b> of current. What voltage does it need?</td></tr>
        <tr><td>Know</td><td>I = 2 A, R = 4.5 Ω</td></tr><tr><td>Find</td><td>V</td></tr>
        <tr><td>Formula</td><td>V = I × R</td></tr><tr><td>Solve</td><td>V = 2 × 4.5 = <b>9 V</b></td></tr></table></div>
      <div class="example"><div class="ex-t">Example 3: Find the resistance (with milliamps)</div><table>
        <tr><td>Problem</td><td>A micro:bit pin puts <b>3 V</b> across a resistor, and an ammeter reads <b>15 mA</b>. What is the resistance?</td></tr>
        <tr><td>Convert</td><td>15 mA ÷ 1000 = <b>0.015 A</b></td></tr>
        <tr><td>Know</td><td>V = 3 V, I = 0.015 A</td></tr><tr><td>Find</td><td>R</td></tr>
        <tr><td>Formula</td><td>R = V ÷ I</td></tr><tr><td>Solve</td><td>R = 3 ÷ 0.015 = <b>200 Ω</b></td></tr></table></div>` },
    { type:'callout', kind:'warn', title:'Watch your units!', html:'<p>Always change <b>milliamps to amps</b> before using Ohm’s Law: divide by 1000. For example, 20 mA = 0.020 A.</p>' },
    { type:'widget', id:'p2-practice', widget:'ohmPractice', icon:'🧮', title:'Ohm’s Law Practice', opts:{ need:4 }, tasks:[ { id:'done', text:'Solve <b>4</b> problems correctly. (If you miss a problem twice, you’ll see how to solve it and get a new one.)' } ] },
    { type:'mc', id:'p2-u-double', q:'If you <b>double</b> the voltage and keep the resistance the same, the current will…', choices:['double','be cut in half','stay the same','become four times bigger'], answer:0, explain:'I = V ÷ R. Double V → double I.' }
  ]},

  /* ---------------- 2.4 ---------------- */
  { id:'p2s4', title:'Series Circuits', minutes:9, blocks:[
    { type:'html', html:'<p class="lead">When you connect more than one load, there are two basic ways to arrange them. The first is a <b>series circuit</b>.</p><p>In a series circuit, the parts are connected <b>one after another</b> in a single loop. There is only <b>one path</b> for the current to follow, like cars on a one-lane road.</p>' },
    { type:'callout', kind:'key', title:'Series circuit rules', html:'<ul style="margin:0"><li><b>One path</b> for the current.</li><li>The <b>current is the same</b> everywhere in the loop.</li><li>Resistances <b>add up</b>: R<sub>total</sub> = R<sub>1</sub> + R<sub>2</sub> + R<sub>3</sub> …</li><li>The battery’s voltage is <b>shared</b> (split) among the parts.</li><li>If one part breaks or is removed, the <b>whole circuit stops</b>.</li></ul>' },
    { type:'widget', id:'p2-series', widget:'seriesParallel', icon:'🔗', title:'Series Circuit Lab', opts:{ mode:'series' }, tasks:[
      { id:'three', text:'Add bulbs until there are <b>3 bulbs</b> in series. Watch the brightness and the ammeter as you go.' },
      { id:'unscrew', text:'With 2 or more bulbs, click one bulb to <b>unscrew</b> it. What happens to the others?' }
    ]},
    { type:'html', html:'<p>Use the lab to fill in the data. Each bulb has <b>10 Ω</b> of resistance and the battery is <b>9 V</b>. Make sure all the bulbs are screwed in.</p>' },
    { type:'num', id:'p2-s-1', q:'With <b>1 bulb</b>, what is the total current?', answer:0.9, unit:'A', tol:0.02, hint:'Set the lab to 1 bulb and read the ammeter.', explain:'9 V ÷ 10 Ω = 0.9 A.' },
    { type:'num', id:'p2-s-2', q:'With <b>2 bulbs</b> in series, what is the total current?', answer:0.45, unit:'A', tol:0.02, hint:'Add a second bulb and read the ammeter. Are both bulbs screwed in?', explain:'Total resistance = 10 + 10 = 20 Ω. 9 V ÷ 20 Ω = 0.45 A.' },
    { type:'num', id:'p2-s-3', q:'With <b>3 bulbs</b> in series, what is the total current?', answer:0.3, unit:'A', tol:0.02, hint:'Add a third bulb and read the ammeter.', explain:'Total resistance = 30 Ω. 9 V ÷ 30 Ω = 0.3 A.' },
    { type:'num', id:'p2-s-v', q:'With <b>3 bulbs</b> in series, what is the voltage across <b>each</b> bulb?', answer:3, unit:'V', tol:0.02, hint:'Look at the table under the lab.', explain:'The 9 V is shared equally by 3 identical bulbs: 9 ÷ 3 = 3 V each.' },
    { type:'mc', id:'p2-s-bright', q:'What happened to the bulbs’ brightness as you added more bulbs in series?', choices:['Each bulb got dimmer','Each bulb got brighter','The brightness stayed the same','Only the last bulb got dimmer'], answer:0, explain:'More bulbs = more total resistance = less current, and each bulb gets a smaller share of the voltage.' },
    { type:'mc', id:'p2-s-break', q:'What happened when you unscrewed one bulb in the series circuit?', choices:['All the bulbs went out','Only that bulb went out','The other bulbs got brighter','Nothing changed'], answer:0, explain:'Unscrewing a bulb makes a gap in the only path, so the current stops everywhere. (Old holiday lights worked this way. One bad bulb, and the whole string went dark!)' },
    { type:'num', id:'p2-s-calc', label:'Calculate', q:'A series circuit has resistors of <b>10 Ω</b>, <b>20 Ω</b>, and <b>30 Ω</b>. What is the total resistance?', answer:60, unit:'Ω', tol:0.001, hint:'In series, resistances add up.', explain:'10 + 20 + 30 = 60 Ω.' }
  ]},

  /* ---------------- 2.5 ---------------- */
  { id:'p2s5', title:'Parallel Circuits', minutes:9, blocks:[
    { type:'html', html:'<p class="lead">The second way to connect loads is a <b>parallel circuit</b>.</p><p>In a parallel circuit, each load gets its <b>own path</b> (called a <b>branch</b>) that connects straight to the battery. The current splits up to go through the branches, then joins back together, like lanes on a freeway.</p>' },
    { type:'callout', kind:'key', title:'Parallel circuit rules', html:'<ul style="margin:0"><li><b>More than one path</b> (branches).</li><li>Each branch gets the <b>full battery voltage</b>.</li><li>The current <b>splits</b> between branches: total current = the sum of the branch currents.</li><li>Adding branches makes the <b>total current go up</b> (the battery works harder and drains faster).</li><li>If one branch breaks, the <b>other branches keep working</b>.</li></ul>' },
    { type:'widget', id:'p2-parallel', widget:'seriesParallel', icon:'🔀', title:'Parallel Circuit Lab', opts:{ mode:'parallel' }, tasks:[
      { id:'three', text:'Add bulbs until there are <b>3 bulbs</b> in parallel. Watch the brightness and the ammeter as you go.' },
      { id:'unscrew', text:'With 2 or more bulbs, click one bulb to <b>unscrew</b> it. What happens to the others?' }
    ]},
    { type:'html', html:'<p>Each bulb is <b>10 Ω</b> and the battery is <b>9 V</b>. Make sure all the bulbs are screwed in.</p>' },
    { type:'num', id:'p2-p-1', q:'With <b>1 bulb</b>, what is the total current?', answer:0.9, unit:'A', tol:0.02, hint:'Set the lab to 1 bulb and read the ammeter.', explain:'9 V ÷ 10 Ω = 0.9 A.' },
    { type:'num', id:'p2-p-2', q:'With <b>2 bulbs</b> in parallel, what is the total current?', answer:1.8, unit:'A', tol:0.02, hint:'Add a second bulb. Read the ammeter next to the battery.', explain:'Each branch carries 0.9 A, so the total is 0.9 + 0.9 = 1.8 A.' },
    { type:'num', id:'p2-p-3', q:'With <b>3 bulbs</b> in parallel, what is the total current?', answer:2.7, unit:'A', tol:0.02, hint:'Add a third bulb and read the ammeter.', explain:'0.9 + 0.9 + 0.9 = 2.7 A.' },
    { type:'num', id:'p2-p-v', q:'With <b>3 bulbs</b> in parallel, what is the voltage across <b>each</b> bulb?', answer:9, unit:'V', tol:0.02, hint:'Look at the table under the lab.', explain:'Every branch connects straight to the battery, so each bulb gets the full 9 V.' },
    { type:'mc', id:'p2-p-bright', q:'What happened to the brightness of each bulb as you added bulbs in parallel?', choices:['It stayed the same','Each bulb got dimmer','Each bulb got brighter','The bulbs flickered'], answer:0, explain:'Each bulb still gets the full 9 V and 0.9 A, so each one is just as bright.' },
    { type:'mc', id:'p2-p-break', q:'What happened when you unscrewed one bulb in the parallel circuit?', choices:['The other bulbs stayed lit','All the bulbs went out','The other bulbs got much brighter','The battery stopped working'], answer:0, explain:'The other branches are still complete loops, so they keep working. Only the total current drops.' },
    { type:'mc', id:'p2-p-house', q:'Homes are wired in parallel. Why?', choices:['Each device gets the full voltage and can be turned on or off without affecting the others','So that all the lights get dimmer at the same time','So that one broken lamp turns off the whole house','Because parallel circuits use less electricity no matter what'], answer:0, explain:'In parallel, each outlet and light is its own branch with the full voltage.' },
    { type:'num', id:'p2-p-calc', label:'Calculate', q:'Two branches in a parallel circuit carry <b>0.2 A</b> and <b>0.5 A</b>. What is the total current from the battery?', answer:0.7, unit:'A', tol:0.01, hint:'In parallel, the branch currents add up to the total.', explain:'0.2 + 0.5 = 0.7 A.' },
    { type:'html', html:`<table class="compare"><tr><th></th><th>Series 🔗</th><th>Parallel 🔀</th></tr>
      <tr><td><b>Paths</b></td><td>One path</td><td>Two or more branches</td></tr>
      <tr><td><b>Current</b></td><td>Same everywhere</td><td>Splits; branches add up to the total</td></tr>
      <tr><td><b>Voltage</b></td><td>Shared among the parts</td><td>Full battery voltage on each branch</td></tr>
      <tr><td><b>Add more bulbs</b></td><td>Each gets dimmer</td><td>Each stays bright; total current goes up</td></tr>
      <tr><td><b>One bulb breaks</b></td><td>Everything goes out</td><td>The others keep working</td></tr></table>` }
  ]},

  /* ---------------- 2.6 ---------------- */
  { id:'p2s6', title:'Build Challenge & Short Circuits', minutes:12, blocks:[
    { type:'html', html:'<p class="lead">Put it all together! Build series and parallel circuits in the Circuit Lab and measure them like an engineer.</p>' },
    { type:'sim', title:'Circuit Construction Kit: DC', src: PHET.cck },
    { type:'h3', text:'Build A: Series' },
    { type:'steps', items:[
      'On the <b>Intro</b> screen, set a battery to <b>9 V</b>.',
      'Connect <b>two resistors</b> one after the other in a single loop. Set each one to <b>10 Ω</b>.',
      'Check <b>Values</b> in the right-side menu so you can see the numbers.'
    ]},
    { type:'num', id:'p2-b-si', q:'Put the ammeter on any wire. What current does it read?', answer:0.45, unit:'A', hint:'Total resistance is 10 + 10 = 20 Ω. Check that both resistors are 10 Ω and the battery is 9 V.', explain:'9 V ÷ 20 Ω = 0.45 A.' },
    { type:'num', id:'p2-b-sv1', q:'Use the voltmeter across <b>one</b> resistor. What does it read?', answer:4.5, unit:'V', hint:'Put one probe on each end of just one resistor.', explain:'The two equal resistors share the 9 V: 4.5 V each.' },
    { type:'num', id:'p2-b-sv2', q:'Now put the voltmeter across <b>both</b> resistors together. What does it read?', answer:9, unit:'V', hint:'Put one probe before the first resistor and one after the second.', explain:'4.5 V + 4.5 V = 9 V, the whole battery voltage.' },
    { type:'h3', text:'Build B: Parallel' },
    { type:'steps', items:[
      'Clear the work area (or build next to your first circuit with a new battery set to <b>9 V</b>).',
      'Connect two <b>10 Ω</b> resistors <b>side by side</b>: each resistor should connect directly to both ends of the battery, making two branches.'
    ]},
    { type:'num', id:'p2-b-pi1', q:'Put the ammeter on the wire of <b>one branch</b> (right next to one resistor). What does it read?', answer:0.9, unit:'A', hint:'Each branch has 9 V across 10 Ω.', explain:'9 V ÷ 10 Ω = 0.9 A in each branch.' },
    { type:'num', id:'p2-b-pit', q:'Put the ammeter on the <b>main wire</b> right next to the battery (before the current splits). What does it read?', answer:1.8, unit:'A', hint:'The main wire carries the current for both branches.', explain:'0.9 A + 0.9 A = 1.8 A.' },
    { type:'num', id:'p2-b-pv', q:'Use the voltmeter across <b>one</b> resistor in the parallel circuit. What does it read?', answer:9, unit:'V', hint:'One probe on each end of one resistor.', explain:'Each branch gets the full battery voltage: 9 V.' },
    { type:'short', id:'p2-b-compare', q:'Compare: How was the voltage across one resistor in <b>series</b> different from one in <b>parallel</b>? Explain why.', minWords:15, sample:'In series, each resistor only got 4.5 V because the two resistors shared the 9 V battery. In parallel, each resistor got the full 9 V because each branch connects straight to the battery.', check:'Did you give both numbers (4.5 V and 9 V) and explain sharing vs. separate branches?' },
    { type:'h3', text:'Short circuits ⚠️' },
    { type:'html', html:'<p>A <b>short circuit</b> happens when current finds a path with almost <b>no resistance</b>, like a plain wire connected straight from one end of a battery to the other. With almost zero resistance, Ohm’s Law says the current becomes <b>huge</b> (I = V ÷ R, and dividing by a tiny number gives a giant answer). Huge currents make wires very hot, drain batteries fast, and can melt plastic or start fires.</p>' },
    { type:'widget', id:'p2-short', widget:'circuitPlayground', icon:'⚠️', title:'Short Circuit Demo', opts:{ allowShort:true }, tasks:[
      { id:'on', text:'Close the switch so the bulb lights.' },
      { id:'short', text:'With the bulb lit, add the <b>shortcut wire</b>. Watch the bulb, the electrons, and the battery.' }
    ]},
    { type:'steps', items:[ 'Now try it in the sim: add a single wire that connects <b>directly</b> from one end of a battery to the other end, with nothing else in between. Watch what happens.' ] },
    { type:'mc', id:'p2-b-short', q:'What happened when you added the shortcut wire?', choices:['The current became very large and the bulb or resistors were skipped (the sim may even show fire!)','Nothing changed','The current stopped completely','The battery’s voltage doubled'], answer:0, explain:'The shortcut has almost no resistance, so a huge current rushes through it and skips everything else.' },
    { type:'callout', kind:'warn', title:'Real-life safety', html:'<p>Never connect a battery’s + and − ends directly with a wire. On a micro:bit or Arduino, never connect a pin straight to GND with nothing in between. A short circuit can destroy your board, or even burn you.</p>' },
    { type:'mc', id:'p2-b-which', q:'Which of these creates a short circuit?', choices:['A wire connected directly from the + end to the − end of a battery','Adding a resistor to a circuit','Adding a switch to a circuit','A bulb connected to a battery with two wires'], answer:0, explain:'A wire straight across the battery is a no-resistance path: a short circuit.' }
  ]},

  /* ---------------- 2.7 ---------------- */
  { id:'p2s7', title:'Next Up: Smart Circuits with LEDs', minutes:9, blocks:[
    { type:'html', html:'<p class="lead">Next, you will connect circuits to a <b>micro:bit</b> or <b>Arduino</b>, tiny computers that can turn parts on and off with code. The first part you’ll control is an <b>LED</b>.</p>' },
    { type:'vocab', items:[
      { icon:'🔴', term:'LED', def:'<b>L</b>ight <b>E</b>mitting <b>D</b>iode. It makes light using very little energy.' },
      { icon:'➡️', term:'Diode', def:'A one-way valve for current. Current can flow through an LED in <b>one direction only</b>.' },
      { icon:'🦵', term:'Legs', def:'The <b>long leg</b> is positive (+, the anode). The <b>short leg</b> is negative (−, the cathode).' },
      { icon:'🛡️', term:'Current-limiting resistor', def:'LEDs burn out with too much current (more than about <b>20 mA</b>). A resistor in series keeps the current safe.' }
    ]},
    { type:'figure', svg: G.ledDiagram(), caption:'An LED’s long leg goes toward + (the pin). The short leg goes toward − (GND).' },
    { type:'widget', id:'p2-led', widget:'ledLab', icon:'🔴', title:'LED Resistor Lab', tasks:[
      { id:'burn', text:'Pick a resistor that is <b>too small</b>. See what happens to the LED.' },
      { id:'safeA', text:'On the <b>Arduino</b>, find a resistor that makes the LED <b>safe and bright</b> (5–20 mA).' },
      { id:'safeM', text:'Switch to the <b>micro:bit</b>. Find a resistor that makes the LED <b>safe and bright</b> (5–20 mA).' },
      { id:'flip', text:'Flip the LED around backwards. What happens?' }
    ]},
    { type:'h3', text:'Why do Arduino kits use 220 Ω resistors?' },
    { type:'html', html:`<div class="example"><div class="ex-t">Do the math</div><table>
      <tr><td>Step 1</td><td>An Arduino pin gives <b>5 V</b>. A red LED uses about <b>2 V</b>. That leaves <b>5 − 2 = 3 V</b> for the resistor.</td></tr>
      <tr><td>Step 2</td><td>We want about <b>15 mA</b> = <b>0.015 A</b> (bright, but safely under 20 mA).</td></tr>
      <tr><td>Step 3</td><td>R = V ÷ I = 3 ÷ 0.015 = <b>200 Ω</b></td></tr>
      <tr><td>Step 4</td><td>Resistors come in standard sizes, so we pick the next size up: <b>220 Ω</b>. That’s why almost every Arduino kit uses 220 Ω resistors with LEDs!</td></tr></table></div>` },
    { type:'num', id:'p2-l-calc', label:'Your turn', q:'A micro:bit pin gives about <b>3 V</b>. The LED uses <b>2 V</b>, which leaves <b>1 V</b> for the resistor. What resistance gives a current of <b>10 mA</b> (0.010 A)?', answer:100, unit:'Ω', tol:0.01, hint:'Use R = V ÷ I with V = 1 V (the voltage left for the resistor) and I = 0.010 A.', explain:'R = 1 ÷ 0.010 = 100 Ω.' },
    { type:'mc', id:'p2-l-why', q:'Why does an LED need a resistor?', choices:['To limit the current so the LED doesn’t burn out','To make the LED blink','To increase the voltage to the LED','To change the LED’s color'], answer:0, explain:'The resistor limits the current to a safe level.' },
    { type:'mc', id:'p2-l-leg', q:'Which LED leg connects toward the <b>positive (+)</b> side, like an Arduino pin?', choices:['The longer leg','The shorter leg','Either leg works the same','The leg next to the flat edge'], answer:0, explain:'Long leg = + (anode). The flat edge marks the − side (cathode).' },
    { type:'short', id:'p2-l-reflect', q:'Reflection: Describe one thing you learned about circuits that you will use when you build with a micro:bit or Arduino.', minWords:12, sample:'I will always put a resistor, like a 220 Ω resistor, in series with an LED so the current stays under 20 mA, and I will make sure the long leg faces the pin. I will also never connect a pin straight to GND because that would be a short circuit.', check:'Did you name a specific idea, like resistors, LED direction, short circuits, or Ohm’s Law?' }
  ]}
  ],

  /* ---------------- Part 2 Check for Understanding ---------------- */
  quiz: {
    count: 10,
    topics: {
      ohm:      { name:'Ohm’s Law relationships', section:'p2s2', review:'<p><b>V = I × R.</b> More voltage → more current. More resistance → less current. If V doubles, I doubles. If R doubles, I is cut in half. <b>1 A = 1000 mA</b>, so 25 mA = 0.025 A.</p>' },
      calc:     { name:'Calculating with V = I × R', section:'p2s3', review:'<p>Cover the letter you want in the triangle: <b>V = I × R</b>, <b>I = V ÷ R</b>, <b>R = V ÷ I</b>. Change mA to A first (÷ 1000). Example: 12 V across 4 Ω → I = 12 ÷ 4 = 3 A.</p>' },
      series:   { name:'Series circuits', section:'p2s4', review:'<p>Series = <b>one path</b>. Current is the <b>same everywhere</b>. Resistances <b>add</b> (10 + 20 + 30 = 60 Ω). Voltage is <b>shared</b> (two equal bulbs on 9 V get 4.5 V each). More bulbs → dimmer. One breaks → <b>all go out</b>.</p>' },
      parallel: { name:'Parallel circuits', section:'p2s5', review:'<p>Parallel = <b>branches</b>. Each branch gets the <b>full battery voltage</b>. Branch currents <b>add up</b> to the total (0.2 A + 0.3 A = 0.5 A). More bulbs → same brightness, more total current. One breaks → the others <b>stay on</b>. Homes are wired in parallel.</p>' },
      short:    { name:'Short circuits & safety', section:'p2s6', review:'<p>A <b>short circuit</b> is a path with almost no resistance (like a wire straight from + to −). The current becomes huge, wires get hot, batteries drain, and parts can melt or catch fire. Never connect a pin straight to GND.</p>' },
      led:      { name:'LEDs & resistors', section:'p2s7', review:'<p>LEDs only let current flow one way: <b>long leg = +</b>, short leg/flat edge = −. Always use a <b>current-limiting resistor</b> to keep the current under about 20 mA. Arduino: (5 V − 2 V) ÷ 0.015 A = 200 Ω → use 220 Ω.</p>' }
    },
    pool: [
      { id:'o1', topic:'ohm', q:'Which equation is Ohm’s Law?', choices:['V = I × R','V = I + R','I = V × R','R = I × V'], answer:0, explain:'Voltage equals current times resistance.' },
      { id:'o2', topic:'ohm', q:'If the voltage doubles and the resistance stays the same, the current…', choices:['doubles','is cut in half','stays the same','drops to zero'], answer:0, explain:'I = V ÷ R, so doubling V doubles I.' },
      { id:'o3', topic:'ohm', q:'If the resistance doubles and the voltage stays the same, the current…', choices:['is cut in half','doubles','stays the same','becomes four times bigger'], answer:0, explain:'Dividing by a number twice as big gives half the answer.' },
      { id:'o4', topic:'ohm', q:'25 mA is equal to…', choices:['0.025 A','2.5 A','0.25 A','25,000 A'], answer:0, explain:'Divide milliamps by 1000: 25 ÷ 1000 = 0.025 A.' },
      { id:'k1', topic:'calc', q:'A <b>12 V</b> battery is connected to a <b>4 Ω</b> resistor. How much current flows?', choices:['3 A','48 A','0.33 A','16 A'], answer:0, explain:'I = V ÷ R = 12 ÷ 4 = 3 A.' },
      { id:'k2', topic:'calc', q:'A current of <b>0.5 A</b> flows through a <b>20 Ω</b> resistor. What is the voltage across it?', choices:['10 V','40 V','0.025 V','20.5 V'], answer:0, explain:'V = I × R = 0.5 × 20 = 10 V.' },
      { id:'k3', topic:'calc', q:'A <b>9 V</b> battery pushes <b>0.03 A</b> through a resistor. What is its resistance?', choices:['300 Ω','0.27 Ω','30 Ω','3 Ω'], answer:0, explain:'R = V ÷ I = 9 ÷ 0.03 = 300 Ω.' },
      { id:'k4', topic:'calc', q:'A micro:bit supplies <b>3 V</b> to a <b>100 Ω</b> resistor. How much current flows?', choices:['0.03 A (30 mA)','300 A','0.3 A','3 A'], answer:0, explain:'I = 3 ÷ 100 = 0.03 A = 30 mA.' },
      { id:'k5', topic:'calc', q:'A robot motor has <b>6 Ω</b> of resistance and needs <b>1.5 A</b>. What voltage does it need?', choices:['9 V','4 V','4.5 V','7.5 V'], answer:0, explain:'V = I × R = 1.5 × 6 = 9 V.' },
      { id:'se1', topic:'series', q:'In a series circuit, the current is…', choices:['the same everywhere in the loop','biggest right next to the battery','split between the branches','zero after the first bulb'], answer:0, explain:'There is only one path, so the same current flows through every part.' },
      { id:'se2', topic:'series', q:'What is the total resistance of <b>10 Ω</b>, <b>20 Ω</b>, and <b>30 Ω</b> resistors in series?', choices:['60 Ω','20 Ω','6000 Ω','5.5 Ω'], answer:0, explain:'In series, resistances add: 10 + 20 + 30 = 60 Ω.' },
      { id:'se3', topic:'series', q:'Adding more bulbs to a <b>series</b> circuit makes each bulb…', choices:['dimmer','brighter','stay the same','flash'], answer:0, explain:'More resistance means less current, and the voltage is shared by more bulbs.' },
      { id:'se4', topic:'series', q:'In a series circuit, one bulb burns out. What happens to the other bulbs?', choices:['They all go out','They stay lit','They get brighter','Only the next bulb goes out'], answer:0, explain:'The only path is broken, so no current flows anywhere.' },
      { id:'se5', topic:'series', q:'Two identical bulbs are in series with a <b>9 V</b> battery. What is the voltage across each bulb?', choices:['4.5 V','9 V','18 V','0 V'], answer:0, explain:'The voltage is shared equally: 9 ÷ 2 = 4.5 V each.' },
      { id:'pa1', topic:'parallel', q:'In a parallel circuit, each branch gets…', choices:['the full battery voltage','half of the battery voltage','no voltage','only the leftover current'], answer:0, explain:'Each branch connects straight to the battery.' },
      { id:'pa2', topic:'parallel', q:'Two parallel branches carry <b>0.2 A</b> and <b>0.3 A</b>. What is the total current from the battery?', choices:['0.5 A','0.1 A','0.06 A','0.3 A'], answer:0, explain:'Branch currents add: 0.2 + 0.3 = 0.5 A.' },
      { id:'pa3', topic:'parallel', q:'What happens to the <b>total current</b> when you add more bulbs in parallel?', choices:['It increases','It decreases','It stays the same','It drops to zero'], answer:0, explain:'Each new branch adds its own current to the total.' },
      { id:'pa4', topic:'parallel', q:'Why are homes wired in parallel?', choices:['Each device gets the full voltage and works on its own','So all the lights dim together','So one broken lamp shuts off the whole house','So the current is the same in every device'], answer:0, explain:'Parallel wiring lets each device work independently with full voltage.' },
      { id:'pa5', topic:'parallel', q:'One bulb in a parallel circuit is unscrewed. What happens to the other bulbs?', choices:['They stay lit','They all go out','They get dimmer','They start flickering'], answer:0, explain:'Their branches are still complete loops.' },
      { id:'sh1', topic:'short', q:'What is a short circuit?', choices:['A path with almost no resistance that lets a very large current flow','A circuit built with short wires','A circuit that is switched off','A circuit with only one bulb'], answer:0, explain:'Almost no resistance means a huge current.' },
      { id:'sh2', topic:'short', q:'Why is a short circuit dangerous?', choices:['The huge current makes wires hot and can damage parts or start fires','It stops all current, so nothing works','It only makes bulbs a little too bright','It reverses the electrons, which is harmless'], answer:0, explain:'Big current = lots of heat.' },
      { id:'sh3', topic:'short', q:'Which of these creates a short circuit?', choices:['A wire connected directly from the + end to the − end of a battery','Adding a resistor in series','Adding a switch to the loop','A bulb and two wires in a complete loop'], answer:0, explain:'A plain wire across the battery has almost no resistance.' },
      { id:'le1', topic:'led', q:'Why does an LED need a resistor?', choices:['To limit the current so the LED doesn’t burn out','To make the LED blink','To increase the voltage','To change the LED’s color'], answer:0, explain:'A current-limiting resistor keeps the current under about 20 mA.' },
      { id:'le2', topic:'led', q:'Which leg of an LED is positive (+)?', choices:['The longer leg','The shorter leg','Either leg','The leg by the flat edge'], answer:0, explain:'Long leg = anode (+).' },
      { id:'le3', topic:'led', q:'An Arduino pin gives 5 V. The LED uses 2 V. You want 0.015 A. What resistance do you need?', choices:['200 Ω','333 Ω','133 Ω','0.003 Ω'], answer:0, explain:'The resistor gets 5 − 2 = 3 V. R = 3 ÷ 0.015 = 200 Ω (use 220 Ω).' },
      { id:'le4', topic:'led', q:'An LED is put into a circuit backwards. What happens?', choices:['It doesn’t light, because current can only flow through it one way','It lights up brighter','It changes color','It works exactly the same'], answer:0, explain:'An LED is a diode, a one-way valve for current.' }
    ]
  },

  remediation: [
    { id:'r1', q:'To find <b>current</b>, which form of Ohm’s Law do you use?', choices:['I = V ÷ R','I = V × R','I = R ÷ V','I = V + R'], answer:0, explain:'Cover I in the triangle: V over R, so divide.' },
    { id:'r2', q:'A <b>6 V</b> battery is connected to a <b>3 Ω</b> resistor. What is the current?', choices:['2 A','18 A','0.5 A','9 A'], answer:0, explain:'I = 6 ÷ 3 = 2 A.' },
    { id:'r3', q:'In <b>series</b> the current is ___. In <b>parallel</b>, each branch gets ___.', choices:['the same everywhere; the full battery voltage','split up; half the voltage','zero; the full current','the full voltage; the same current'], answer:0, explain:'Series: same current, shared voltage. Parallel: full voltage, split current.' },
    { id:'r4', q:'A short circuit is dangerous because…', choices:['almost no resistance lets a huge current flow and create heat','it has too much resistance','it makes the current stop','it uses AC instead of DC'], answer:0, explain:'Tiny resistance → giant current → heat.' },
    { id:'r5', q:'Why do we put a resistor in series with an LED?', choices:['To keep the current low enough that the LED doesn’t burn out','To make the LED brighter than normal','To store energy for later','So the LED works backwards'], answer:0, explain:'A current-limiting resistor protects the LED.' }
  ]
});

<script>
/* ============ Interactive widgets ============
   Each widget: WIDGETS.name = function(root, api)
   api.opts (options), api.complete(taskId), api.isDone(taskId) */
window.WIDGETS = (function(){
const W = {};
const NS = 'http://www.w3.org/2000/svg';

/* animation loop that stops when the widget leaves the page */
function loop(root, fn){
  let last = performance.now(), started = false, waits = 0;
  function f(t){
    if(!root.isConnected){ if(started || ++waits > 120) return; requestAnimationFrame(f); return; }
    started = true;
    const dt = Math.min(0.05, (t-last)/1000); last = t;
    fn(dt, t/1000);
    requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}
function h(html){ const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function btn(label, cls, on){ const b = document.createElement('button'); b.type='button'; b.className = 'btn btn-sm ' + (cls||''); b.innerHTML = label; b.addEventListener('click', on); return b; }
function status(){ const s = document.createElement('div'); s.className='w-status'; s.setAttribute('aria-live','polite'); return s; }
function segDots(segs, spacing, phases, gap){
  // segs: [{x1,y1,x2,y2,c}] ; phases: map current->distance
  let out = '';
  segs.forEach(s=>{
    const L = Math.hypot(s.x2-s.x1, s.y2-s.y1); if(L < 1) return;
    const ph = ((phases(s.c) % spacing) + spacing) % spacing;
    for(let d = ph; d < L; d += spacing){
      const x = s.x1 + (s.x2-s.x1)*d/L, y = s.y1 + (s.y2-s.y1)*d/L;
      if(s.skip && s.skip.some(k=>Math.hypot(x-k[0], y-k[1]) < k[2])) continue;
      if(gap && gap(x,y)) continue;
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="#2f6bff" stroke="#fff" stroke-width="1"/>`;
    }
  });
  return out;
}

/* ---------------- 1. Marble tube ---------------- */
W.marbleTube = function(root, api){
  const N = 10, r = 16, x0 = 80, y = 64;
  let pushes = 0, tracked = 3, animT = -1;
  root.innerHTML = `<svg viewBox="0 0 560 140" width="560"><g class="tube"></g><g class="ms"></g><text x="${x0-58}" y="${y+6}" font-size="26">👉</text></svg>`;
  const svg = root.querySelector('svg'), ms = svg.querySelector('.ms');
  svg.querySelector('.tube').innerHTML = `<rect x="${x0-4}" y="${y-r-5}" width="${N*2*r+8}" height="${2*r+10}" rx="${r+5}" fill="#e8f1ff" stroke="#7da0e6" stroke-width="2"/>`;
  const info = document.createElement('div'); info.className='w-status';
  function draw(o){
    let s = '';
    for(let i=-1;i<N;i++){
      if(i===-1 && o<=0) continue;
      let cx = x0 + r + i*2*r + o*2*r, cy = y, op = 1;
      if(i===N-1 && o>0){ cy = y + 60*o*o; op = 1 - o*0.3; }
      const isT = (i===tracked);
      s += `<circle cx="${cx}" cy="${cy}" r="${r-1.5}" fill="${isT?'#ffc53d':'#5b8def'}" stroke="${isT?'#a16207':'#2c4fa8'}" stroke-width="2" opacity="${op}"/>`;
    }
    ms.innerHTML = s;
  }
  function upd(){ info.innerHTML = `Marbles pushed in: <b>${pushes}</b> &nbsp;·&nbsp; Marbles out the other end: <b>${pushes}</b> &nbsp;·&nbsp; The yellow marble moved only <b>${Math.min(pushes, 99)}</b> space${pushes===1?'':'s'}`; }
  const b = btn('Push a marble in ➜','btn-primary', ()=>{
    if(animT >= 0) return;
    animT = 0;
    const t0 = performance.now();
    (function step(t){
      const o = Math.min(1, (t-t0)/450); draw(o);
      if(o < 1) requestAnimationFrame(step);
      else { animT = -1; pushes++; tracked = (tracked+1) % N; draw(0); upd(); if(pushes>=3) api.complete('push3'); }
    })(t0);
  });
  const c = document.createElement('div'); c.className='w-controls'; c.appendChild(b);
  root.appendChild(c); root.appendChild(info);
  draw(0); upd();
};

/* ---------------- 2. Circuit playground ---------------- */
W.circuitPlayground = function(root, api){
  const allowShort = !!api.opts.allowShort;
  const L=90, R=430, T=60, B=240, SX=360;
  let closed = false, cut = false, short = false, wasLit = false;
  root.innerHTML = `<svg viewBox="0 0 520 300" width="520">${G.defs}
    <g class="wires"></g><g class="dots"></g><g class="parts"></g></svg>`;
  const svg = root.querySelector('svg');
  const gw = svg.querySelector('.wires'), gd = svg.querySelector('.dots'), gp = svg.querySelector('.parts');
  const st = status();
  const bSwitch = btn('','btn-primary', ()=>{ closed = !closed; if(!closed && wasLit) api.complete('off'); update(); });
  const bCut = btn('','', ()=>{ cut = !cut; update(); });
  const bShort = allowShort ? btn('','', ()=>{ short = !short; update(); }) : null;
  const ctr = document.createElement('div'); ctr.className = 'w-controls'; ctr.append(bSwitch, bCut); if(bShort) ctr.appendChild(bShort);
  root.append(ctr, st);
  function lit(){ return closed && !cut && !short; }
  function drawStatic(){
    const wireC = '#b0662a';
    let w = '';
    const line = (x1,y1,x2,y2,c,dash) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c||wireC}" stroke-width="7" stroke-linecap="round" ${dash?'stroke-dasharray="4 10"':''}/>`;
    w += line(L,105,L,T) + line(L,T,190,T) + line(270,T,R,T) + line(R,T,R,126) + line(R,174,R,B) + line(L,B,L,195);
    if(cut){ w += line(R,B,292,B) + line(228,B,L,B) + `<text x="260" y="${B+28}" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">✂ gap</text>`; }
    else w += line(R,B,L,B);
    if(allowShort && short) w += line(SX,T,SX,B,'#e76f00');
    gw.innerHTML = w;
    const hot = closed && !cut && short;
    let p = '';
    // battery
    p += `<g><rect x="${L-24}" y="105" width="48" height="90" rx="6" fill="${hot?'#e5484d':'#394150'}" stroke="#1f2430" stroke-width="2"/>
      <rect x="${L-24}" y="105" width="48" height="26" rx="6" fill="#d9822b" stroke="#1f2430" stroke-width="2"/>
      <text x="${L}" y="124" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">+</text>
      <text x="${L}" y="186" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">−</text>
      <text x="${L-34}" y="155" text-anchor="end" font-size="13" font-weight="700" fill="#172033">Battery</text>
      ${hot?`<text x="${L}" y="92" text-anchor="middle" font-size="14" font-weight="800" fill="#c62828">🔥 HOT!</text>`:''}</g>`;
    // switch
    const bx = closed ? 270 : 262, by = closed ? T : T-34;
    p += `<g class="sw" style="cursor:pointer"><rect x="175" y="${T-50}" width="110" height="70" fill="transparent"/>
      <circle cx="190" cy="${T}" r="7" fill="#20242c"/><circle cx="270" cy="${T}" r="7" fill="#20242c"/>
      <line x1="190" y1="${T}" x2="${bx}" y2="${by}" stroke="#20242c" stroke-width="7" stroke-linecap="round"/>
      <text x="230" y="${T+30}" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">Switch (${closed?'closed':'open'})</text></g>`;
    // bulb
    p += `<g>${lit()?`<circle cx="${R}" cy="150" r="60" fill="url(#glowG)"/>`:''}
      <circle cx="${R}" cy="150" r="26" fill="${lit()?'#fff4b8':'#eef3fb'}" stroke="#7f8ea6" stroke-width="3"/>
      <polyline points="${R},126 ${R-8},140 ${R+8},148 ${R-8},156 ${R+8},164 ${R},174" fill="none" stroke="${lit()?'#f08c00':'#7f8ea6'}" stroke-width="2.5"/>
      <text x="${R+36}" y="155" font-size="13" font-weight="700" fill="#172033">Bulb</text></g>`;
    if(allowShort && short) p += `<text x="${SX-8}" y="150" text-anchor="end" font-size="12" font-weight="700" fill="#e76f00">shortcut</text><text x="${SX-8}" y="165" text-anchor="end" font-size="12" font-weight="700" fill="#e76f00">wire</text>`;
    gp.innerHTML = p;
    gp.querySelector('.sw').addEventListener('click', ()=>bSwitch.click());
  }
  function segs(){
    const flowing = closed && !cut;
    const c1 = flowing ? (short ? 3 : 1) : 0;
    const cb = flowing && !short ? 1 : 0;
    const s = [
      {x1:L,y1:195,x2:L,y2:B,c:c1},
      {x1:L,y1:B,x2:SX,y2:B,c:c1},
      {x1:SX,y1:B,x2:R,y2:B,c:cb},
      {x1:R,y1:B,x2:R,y2:174,c:cb},
      {x1:R,y1:126,x2:R,y2:T,c:cb},
      {x1:R,y1:T,x2:SX,y2:T,c:cb},
      {x1:SX,y1:T,x2:270,y2:T,c:c1},
      {x1:190,y1:T,x2:L,y2:T,c:c1},
      {x1:L,y1:T,x2:L,y2:105,c:c1}
    ];
    if(allowShort && short) s.push({x1:SX,y1:B,x2:SX,y2:T,c:c1});
    return s;
  }
  const dist = {0:0,1:0,3:0};
  loop(root, (dt)=>{
    dist[1] += dt*45; dist[3] += dt*135;
    gd.innerHTML = segDots(segs(), 26, c=>dist[c]||0, (x,y)=> cut && y===B && x>224 && x<296);
  });
  function update(){
    if(lit()){ wasLit = true; api.complete('on'); }
    if(closed && cut) api.complete('cut');
    if(allowShort && closed && !cut && short) api.complete('short');
    drawStatic();
    bSwitch.innerHTML = closed ? '🔘 Open the switch' : '🔘 Close the switch';
    bCut.innerHTML = cut ? '🔧 Repair the wire' : '✂️ Cut the bottom wire';
    if(bShort) bShort.innerHTML = short ? '➖ Remove shortcut wire' : '⚠️ Add a shortcut wire';
    if(closed && !cut && short){ st.className='w-status danger'; st.innerHTML='SHORT CIRCUIT! Charge rushes through the easy shortcut path instead of the bulb. Huge current — the bulb is dark and the battery is overheating.'; }
    else if(lit()){ st.className='w-status on'; st.innerHTML='CLOSED circuit ✅ — the loop is complete, charge flows all the way around, and the bulb is ON.'; }
    else if(closed && cut){ st.className='w-status off'; st.innerHTML='OPEN circuit — the switch is closed, but the cut wire leaves a gap. No complete loop, so NO charge flows anywhere.'; }
    else { st.className='w-status off'; st.innerHTML='OPEN circuit — the switch makes a gap in the loop. The electrons (blue dots) are still in the wires, but none of them can flow.'; }
  }
  update();
};

/* ---------------- 3. Water pipe model ---------------- */
W.waterModel = function(root, api){
  let push = 5, narrow = 5;
  const combos2 = new Set();
  root.innerHTML = `<svg viewBox="0 0 560 240" width="560">
    <rect x="70" y="50" width="420" height="140" rx="30" fill="none" stroke="#5d7fb8" stroke-width="34"/>
    <rect x="70" y="50" width="420" height="140" rx="30" fill="none" stroke="#cfe9ff" stroke-width="28"/>
    <g class="pinch"></g><g class="dots"></g>
    <g class="pump"><circle cx="70" cy="120" r="32" fill="#2355d8" stroke="#10307e" stroke-width="3"/><g class="imp"><path d="M70 96 L78 120 L70 144 L62 120Z" fill="#ffc53d"/><path d="M46 120 L70 112 L94 120 L70 128Z" fill="#ffc53d"/></g></g>
    <g class="wheel"><circle cx="490" cy="120" r="30" fill="#fff" stroke="#10307e" stroke-width="3"/><g class="spokes"><line x1="490" y1="92" x2="490" y2="148" stroke="#10307e" stroke-width="4"/><line x1="462" y1="120" x2="518" y2="120" stroke="#10307e" stroke-width="4"/></g></g>
    <g font-size="13" font-weight="700" fill="#172033">
      <text x="280" y="22" text-anchor="middle">Narrow pipe = resistor (RESISTANCE)</text>
      <text x="16" y="232">Pump = battery (VOLTAGE)</text>
      <text x="544" y="232" text-anchor="end">Water wheel = bulb</text>
      <text x="280" y="116" text-anchor="middle" fill="#1e88e5">Water flow = CURRENT</text>
      <text x="280" y="134" text-anchor="middle" font-weight="400" font-size="12" fill="#5a6679">(flows clockwise around the loop)</text>
    </g></svg>
    <div class="slider-row"><label for="wm-p">Pump push <span class="muted small">(voltage)</span></label><input id="wm-p" type="range" min="1" max="10" step="1" value="5"><output class="op"></output></div>
    <div class="slider-row"><label for="wm-n">Pipe narrowness <span class="muted small">(resistance)</span></label><input id="wm-n" type="range" min="1" max="10" step="1" value="5"><output class="on"></output></div>
    <div class="readouts"><div class="readout"><small>Water flow (current)</small><b class="fl"></b></div></div>`;
  const svg = root.querySelector('svg'), pinch = svg.querySelector('.pinch'), dots = svg.querySelector('.dots');
  const imp = svg.querySelector('.imp'), spokes = svg.querySelector('.spokes');
  const ip = root.querySelector('#wm-p'), inn = root.querySelector('#wm-n');
  ip.id = 'wm-p-' + Math.random().toString(36).slice(2); inn.id = 'wm-n-' + Math.random().toString(36).slice(2);
  root.querySelectorAll('label')[0].setAttribute('for', ip.id); root.querySelectorAll('label')[1].setAttribute('for', inn.id);
  const st = status(); root.appendChild(st);
  const flow = () => push/narrow;
  function upd(){
    push = +ip.value; narrow = +inn.value;
    root.querySelector('.op').textContent = push; root.querySelector('.on').textContent = narrow;
    const f = flow();
    root.querySelector('.fl').textContent = f.toFixed(2) + ' (' + (f>=5?'very fast':f>=1.5?'fast':f>=0.6?'medium':f>=0.25?'slow':'very slow') + ')';
    const k = (narrow-1)/9*11;
    pinch.innerHTML = `<rect x="230" y="36" width="100" height="${3+k}" fill="#8792a2"/><rect x="230" y="${64-k}" width="100" height="${k+3}" fill="#8792a2"/>`;
    if(push===10 && narrow===1) api.complete('fast');
    if(push===1 && narrow===10) api.complete('slow');
    if(Math.abs(f-2) < 1e-9){ combos2.add(push+'/'+narrow); if(combos2.size>=2) api.complete('two'); }
    st.className = 'w-status';
    st.innerHTML = Math.abs(f-2)<1e-9 ? `Flow = 2 ✔ (found ${combos2.size} way${combos2.size===1?'':'s'} so far: ${[...combos2].map(c=>'push '+c.split('/')[0]+' ÷ narrowness '+c.split('/')[1]).join(', ')})` : 'More push → more flow. More narrowness → less flow.';
  }
  ip.addEventListener('input', upd); inn.addEventListener('input', upd);
  let d = 0, ang = 0;
  loop(root, (dt)=>{
    const f = flow(); d += dt * 14 * f; ang += dt * 60 * f;
    imp.setAttribute('transform', `rotate(${ang} 70 120)`); spokes.setAttribute('transform', `rotate(${ang} 490 120)`);
    // loop path clockwise: top edge left->right, right edge down, bottom right->left, left up
    const segs = [{x1:100,y1:50,x2:460,y2:50,c:1},{x1:490,y1:80,x2:490,y2:160,c:1,skip:[[490,120,34]]},{x1:460,y1:190,x2:100,y2:190,c:1},{x1:70,y1:160,x2:70,y2:80,c:1,skip:[[70,120,36]]}];
    dots.innerHTML = segDots(segs, 28, ()=>d).replace(/#2f6bff/g,'#1e88e5');
  });
  upd();
};

/* ---------------- 4. Series / parallel lab ---------------- */
W.seriesParallel = function(root, api){
  const mode = api.opts.mode || 'series';
  const V = 9, Rb = 10;
  let n = 1; const broken = [false,false,false];
  root.innerHTML = `<svg viewBox="0 0 560 270" width="560">${G.defs}<g class="w"></g><g class="d"></g><g class="p"></g></svg>`;
  const svg = root.querySelector('svg'), gw = svg.querySelector('.w'), gd = svg.querySelector('.d'), gp = svg.querySelector('.p');
  const ro = document.createElement('div'); ro.className='readouts';
  const table = document.createElement('div');
  const ctr = document.createElement('div'); ctr.className = 'w-controls';
  const bMinus = btn('➖ Remove a bulb','', ()=>{ if(n>1){ n--; broken[n]=false; calcDraw(); } });
  const bPlus = btn('➕ Add a bulb','btn-primary', ()=>{ if(n<3){ n++; calcDraw(); } });
  ctr.append(bMinus, bPlus);
  const hint = document.createElement('div'); hint.className='small muted center'; hint.style.marginTop='6px'; hint.innerHTML = '👆 Click a bulb to <b>unscrew</b> it (click again to screw it back in).';
  root.append(ctr, hint, ro, table);
  const T=50, B=220, BX=60;
  function xs(){ return mode==='series' ? ({1:[280],2:[210,350],3:[170,280,390]})[n] : ({1:[300],2:[240,400],3:[180,320,460]})[n]; }
  let res = {};
  function calc(){
    const bulbs = [];
    if(mode==='series'){
      const complete = !broken.slice(0,n).some(Boolean);
      const I = complete ? V/(Rb*n) : 0;
      for(let k=0;k<n;k++) bulbs.push({V: complete ? V/n : 0, I, P: I*I*Rb});
      res = { I, Rt: Rb*n, bulbs, complete };
    } else {
      let I = 0;
      for(let k=0;k<n;k++){ const ib = broken[k] ? 0 : V/Rb; I += ib; bulbs.push({V, I:ib, P: ib*ib*Rb}); }
      const working = broken.slice(0,n).filter(b=>!b).length;
      res = { I, Rt: working ? Rb/working : Infinity, bulbs };
    }
  }
  function bulbSVG(x, y, k, vertical){
    const b = res.bulbs[k], ratio = b.P/8.1, br = broken[k];
    const oy = br ? -14 : 0;
    const glow = !br && ratio>0.001 ? `<circle cx="${x}" cy="${y}" r="${24+34*Math.sqrt(ratio)}" fill="url(#glowG)" opacity="${Math.min(1,Math.sqrt(ratio)+0.05)}"/>` : '';
    const fill = br ? '#d7dce4' : (ratio>0.001 ? `rgba(255,236,140,${0.35+0.65*Math.sqrt(ratio)})` : '#eef3fb');
    const fil = vertical ? `M${x} ${y-20+oy} L${x-7} ${y-8+oy} L${x+7} ${y+oy} L${x-7} ${y+8+oy} L${x} ${y+20+oy}` : `M${x-20} ${y+oy} L${x-8} ${y-7+oy} L${x} ${y+7+oy} L${x+8} ${y-7+oy} L${x+20} ${y+oy}`;
    return `<g data-k="${k}" style="cursor:pointer">${glow}<circle cx="${x}" cy="${y+oy}" r="21" fill="${fill}" stroke="${br?'#98a2b3':'#7f8ea6'}" stroke-width="3" ${br?'stroke-dasharray="5 4"':''}/>
      <path d="${fil}" fill="none" stroke="${br?'#98a2b3':(ratio>0.001?'#f08c00':'#7f8ea6')}" stroke-width="2.5"/>
      <circle cx="${x}" cy="${y}" r="30" fill="transparent"/>
      <text x="${vertical? x+30 : x}" y="${vertical? y+5 : y+44}" text-anchor="${vertical?'start':'middle'}" font-size="12" font-weight="700" fill="#172033">${br?'unscrewed':'Bulb '+(k+1)}</text></g>`;
  }
  function draw(){
    const X = xs(), wc = '#b0662a';
    const line = (x1,y1,x2,y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${wc}" stroke-width="7" stroke-linecap="round"/>`;
    let w = '', p = '';
    // battery
    p += `<g><rect x="${BX-22}" y="95" width="44" height="80" rx="6" fill="#394150" stroke="#1f2430" stroke-width="2"/><rect x="${BX-22}" y="95" width="44" height="22" rx="6" fill="#d9822b" stroke="#1f2430" stroke-width="2"/>
      <text x="${BX}" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">+</text><text x="${BX}" y="167" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">−</text>
      <text x="${BX}" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#e7ecf5">9 V</text></g>`;
    if(mode==='series'){
      const Rx = 500;
      w += line(BX,95,BX,T) + line(BX,T,Rx,T) + line(Rx,T,Rx,B) + line(Rx,B,BX,B) + line(BX,B,BX,175);
      X.forEach((x,k)=>{ p += bulbSVG(x, T, k, false); });
      if(res.bulbs.some((b,k)=>broken[k])) X.forEach((x,k)=>{ if(broken[k]) w += `<line x1="${x-21}" y1="${T}" x2="${x+21}" y2="${T}" stroke="#fff" stroke-width="9"/>`; });
      p += `<g><rect x="250" y="${B-18}" width="60" height="36" rx="8" fill="#0f1729"/><text x="280" y="${B+5}" text-anchor="middle" font-size="12" font-weight="700" fill="#9dffb0">A</text></g>`;
    } else {
      const xl = X[X.length-1];
      w += line(BX,95,BX,T) + line(BX,T,xl,T) + line(BX,B,xl,B) + line(BX,B,BX,175);
      X.forEach((x,k)=>{ w += line(x,T,x,B); if(broken[k]) w += `<line x1="${x}" y1="${135-21}" x2="${x}" y2="${135+21}" stroke="#fff" stroke-width="9"/>`; p += bulbSVG(x, 135, k, true); });
      p += `<g><rect x="${BX+24}" y="${B-18}" width="48" height="36" rx="8" fill="#0f1729"/><text x="${BX+48}" y="${B+5}" text-anchor="middle" font-size="12" font-weight="700" fill="#9dffb0">A</text></g>`;
    }
    gw.innerHTML = w; gp.innerHTML = p;
    gp.querySelectorAll('[data-k]').forEach(g=>g.addEventListener('click', ()=>{ const k=+g.getAttribute('data-k'); broken[k]=!broken[k]; if(broken[k] && n>=2) api.complete('unscrew'); calcDraw(); }));
  }
  function segs(){
    const X = xs(), s = [];
    if(mode==='series'){
      const I = res.I, Rx = 500;
      const skip = X.map(x=>[x,T,22]);
      s.push({x1:BX,y1:175,x2:BX,y2:B,c:I},{x1:BX,y1:B,x2:Rx,y2:B,c:I,skip:[[280,B,30]]},{x1:Rx,y1:B,x2:Rx,y2:T,c:I},{x1:Rx,y1:T,x2:BX,y2:T,c:I,skip},{x1:BX,y1:T,x2:BX,y2:95,c:I});
    } else {
      const ib = res.bulbs.map(b=>b.I), tot = res.I;
      const rem = j => ib.slice(j).reduce((a,b)=>a+b,0);
      s.push({x1:BX,y1:175,x2:BX,y2:B,c:tot});
      s.push({x1:BX,y1:B,x2:X[0],y2:B,c:tot,skip:[[BX+48,B,28]]});
      for(let j=1;j<X.length;j++) s.push({x1:X[j-1],y1:B,x2:X[j],y2:B,c:rem(j)});
      X.forEach((x,k)=>{ s.push({x1:x,y1:B,x2:x,y2:T,c:ib[k],skip:[[x,135,24]]}); });
      for(let j=X.length-1;j>=1;j--) s.push({x1:X[j],y1:T,x2:X[j-1],y2:T,c:rem(j)});
      s.push({x1:X[0],y1:T,x2:BX,y2:T,c:tot});
      s.push({x1:BX,y1:T,x2:BX,y2:95,c:tot});
    }
    return s;
  }
  const dist = {};
  let t = 0;
  loop(root, (dt)=>{ t += dt; gd.innerHTML = segDots(segs(), 24, c=> t*55*c); });
  const f = v => (Math.round(v*1000)/1000).toString();
  function readouts(){
    ro.innerHTML = `<div class="readout"><small>Ammeter: total current</small><b>${f(res.I)} A</b></div>
      <div class="readout"><small>Total resistance</small><b>${isFinite(res.Rt)? (mode==='series' && !res.complete ? '∞ (gap)' : f(res.Rt)+' Ω') : '∞ (no path)'}</b></div>
      <div class="readout"><small>Battery</small><b>9 V</b></div>`;
    let rows = res.bulbs.map((b,k)=>`<tr><td><b>Bulb ${k+1}</b>${broken[k]?' (unscrewed)':''}</td><td>${broken[k]?'—':f(mode==='series' ? (res.complete? V/n : 0) : V)+' V'}</td><td>${f(b.I)} A</td><td>${Math.round(100*b.P/8.1)}%</td></tr>`).join('');
    table.innerHTML = `<table class="compare" style="margin-top:10px"><tr><th>Bulb (10 Ω each)</th><th>Voltage across it</th><th>Current through it</th><th>Brightness</th></tr>${rows}</table>`;
    bMinus.disabled = n<=1; bPlus.disabled = n>=3;
    if(n===3) api.complete('three');
  }
  function calcDraw(){ calc(); draw(); readouts(); }
  calcDraw();
};

W.ohmTriangle = function(root, api){

      <g data-l="R" style="cursor:pointer"><polygon points="154,134 224,134 276,218 154,218" fill="transparent"/><text x="200" y="196" text-anchor="middle" font-size="44" font-weight="800" fill="#c62828">R</text></g>
      ${cover==='V'?note(150,100):''}${cover==='I'?note(100,188):''}${cover==='R'?note(200,188):''}`;

};

/* ---------------- 6. Ohm's law practice generator ---------------- */
W.ohmPractice = function(root, api){
  const need = api.opts.need || 4;
  let correct = api.isDone('done') ? need : 0, tries = 0, cur = null, recent = [];
  const things = ['resistor','light bulb','buzzer','small motor','heating wire','robot LED strip'];
  const bank = {
    I: [[3,6],[9,3],[12,4],[6,12],[9,18],[5,250],[3,150],[4.5,9],[12,24],[9,100],[6,2],[24,8],[5,10],[3,100],[9,450],[12,60]],
    V: [[0.5,10],[2,4.5],[0.02,150],[1.5,6],[0.25,20],[3,4],[0.1,90],[0.03,100],[2,6],[0.5,24]],
    R: [[9,0.03],[3,0.015],[12,2],[5,0.025],[6,0.5],[9,0.9],[3,0.01],[12,0.1],[4.5,1.5],[24,3]]
  };
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const nice = v => (Math.round(v*100000)/100000).toString();
  const amp = i => i < 0.1 ? `${nice(i*1000)} mA (= ${nice(i)} A)` : `${nice(i)} A`;
  function newProblem(){
    let type, pair, key;
    do { type = pick(['I','V','R']); pair = pick(bank[type]); key = type + pair.join(','); } while(recent.includes(key));
    recent.push(key); if(recent.length > 6) recent.shift();
    const thing = pick(things);
    if(type==='I'){ const [V,R] = pair; cur = { type, ans: V/R, unit:'A', text:`A <b>${V} V</b> battery is connected to a <b>${R} Ω</b> ${thing}. How much current flows?`, formula:'I = V ÷ R', sol:`I = V ÷ R = ${V} ÷ ${R} = <b>${nice(V/R)} A</b>` + (V/R<0.1? ` (that's ${nice(V/R*1000)} mA)`:'') }; }
    if(type==='V'){ const [I,R] = pair; cur = { type, ans: I*R, unit:'V', text:`A current of <b>${amp(I)}</b> flows through a <b>${R} Ω</b> ${thing}. What voltage is across it?`, formula:'V = I × R', sol:`V = I × R = ${nice(I)} × ${R} = <b>${nice(I*R)} V</b>` }; }
    if(type==='R'){ const [V,I] = pair; cur = { type, ans: V/I, unit:'Ω', text:`A <b>${V} V</b> source pushes <b>${amp(I)}</b> through a ${thing}. What is its resistance?`, formula:'R = V ÷ I', sol:`R = V ÷ I = ${V} ÷ ${nice(I)} = <b>${nice(V/I)} Ω</b>` }; }
    tries = 0; paint();
  }
  root.innerHTML = `<div class="practice-box"><div class="small muted" style="margin-bottom:6px">Use a calculator if you need one. Answer in the unit shown.</div>
    <div class="prob"></div><div class="num-row"><span style="font-weight:700" class="lhs"></span><input type="text" inputmode="decimal" autocomplete="off" aria-label="answer"><span class="unit"></span><button class="btn btn-primary btn-sm chk">Check</button><button class="btn btn-sm nxt" style="display:none">Next problem →</button></div>
    <div class="feedback" aria-live="polite"></div>
    <div style="margin-top:12px"><div class="small cnt" style="margin-bottom:4px"></div><div class="pbar"><i></i></div></div></div>`;
  const prob = root.querySelector('.prob'), inp = root.querySelector('input'), unit = root.querySelector('.unit'), lhs = root.querySelector('.lhs');
  const chk = root.querySelector('.chk'), nxt = root.querySelector('.nxt'), fb = root.querySelector('.feedback'), cnt = root.querySelector('.cnt'), bar = root.querySelector('.pbar i');
  function paint(){
    prob.innerHTML = cur.text; unit.textContent = cur.unit; lhs.textContent = cur.type + ' ='; inp.value=''; inp.disabled=false; chk.style.display=''; nxt.style.display='none'; fb.className='feedback'; fb.innerHTML='';
    cnt.innerHTML = correct >= need ? `✅ Practice complete! (${correct} correct) — keep going for extra practice if you like.` : `Correct answers: <b>${correct}</b> of ${need} needed`;
    bar.style.width = Math.min(100, 100*correct/need) + '%';
  }
  function check(){
    const v = ENGINE_UTILS.parseNum(inp.value, cur.unit);
    if(isNaN(v)){ fb.className='feedback info'; fb.innerHTML='Type a number.'; return; }
    if(Math.abs(v - cur.ans) <= Math.abs(cur.ans)*0.02 + 1e-9){
      correct++; fb.className='feedback ok'; fb.innerHTML = '<b>Correct!</b> ' + cur.sol;
      inp.disabled = true; chk.style.display='none'; nxt.style.display=''; nxt.textContent='Next problem →';
      if(correct >= need) api.complete('done');
      cnt.innerHTML = correct >= need ? `✅ Practice complete! (${correct} correct) — keep going for extra practice if you like.` : `Correct answers: <b>${correct}</b> of ${need} needed`;
      bar.style.width = Math.min(100, 100*correct/need) + '%';
      nxt.focus();
      return;
    }
    tries++;
    if(tries===1){ fb.className='feedback bad'; fb.innerHTML = `<b>Not quite.</b> You are finding <b>${cur.type}</b>, so use <b>${cur.formula}</b>. ` + (cur.unit==='V' || cur.type==='R' ? 'If the current is in mA, change it to amps first (divide by 1000).' : 'Divide carefully — small currents are decimals like 0.02.'); }
    else { fb.className='feedback info'; fb.innerHTML = `Here's how to solve it: ${cur.sol}. This one doesn't count — try a new problem.`; inp.disabled=true; chk.style.display='none'; nxt.style.display=''; nxt.textContent='Try a new problem →'; }
  }
  chk.addEventListener('click', check); inp.addEventListener('keydown', e=>{ if(e.key==='Enter' && !inp.disabled) check(); });
  nxt.addEventListener('click', newProblem);
  newProblem();
};

/* ---------------- 7. LED + resistor lab ---------------- */
W.ledLab = function(root, api){
  const VALUES = [10,47,100,220,330,1000,10000];
  const BAND = ['#111','#7b3f00','#d32f2f','#f57c00','#fbc02d','#388e3c','#1976d2','#7b1fa2','#757575','#fafafa'];
  let board = 'arduino', R = 1000, flipped = false;
  const Vf = 2.0;
  root.innerHTML = `<div class="center" style="margin-bottom:8px"><div class="seg"><button data-b="arduino">Arduino (5 V pin)</button><button data-b="microbit">micro:bit (about 3 V pin)</button></div></div>
    <svg viewBox="0 0 590 245" width="590">${G.defs}<g class="g"></g></svg>
    <div class="small center muted" style="margin-top:4px">Pick a resistor:</div><div class="res-picker"></div>
    <div class="w-controls"><button class="btn btn-sm flip">🔄 Flip the LED around</button></div>
    <div class="readouts"><div class="readout"><small>Current through LED</small><b class="cur"></b></div><div class="readout"><small>Safe limit</small><b>20 mA</b></div></div>`;
  const st = status(); root.appendChild(st);
  const g = root.querySelector('.g'), picker = root.querySelector('.res-picker');
  const lbl = v => v>=1000 ? (v/1000)+' kΩ' : v+' Ω';
  VALUES.forEach(v=>{ const b = document.createElement('button'); b.type='button'; b.textContent = lbl(v); b.dataset.v = v; b.addEventListener('click', ()=>{ R = v; upd(); }); picker.appendChild(b); });
  root.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click', ()=>{ board = b.dataset.b; upd(); }));
  root.querySelector('.flip').addEventListener('click', ()=>{ flipped = !flipped; upd(); });
  function bands(v){ const s = String(v); return [BAND[+s[0]], BAND[+s[1]], BAND[s.length-2]]; }
  function draw(mA){
    const Vs = board==='arduino' ? 5 : 3;
    const burn = mA > 20, ratio = Math.min(1, mA/20);
    const bc = board==='arduino' ? '#0f7c8c' : '#1b1b1b';
    const wire = (d) => `<path d="${d}" fill="none" stroke="#b0662a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
    const [b1,b2,b3] = bands(R);
    const ledFill = burn ? '#3a1a1a' : (mA>0.05 ? `rgba(255,60,60,${0.35+0.65*ratio})` : '#f3b0b0');
    const glow = (!burn && mA>0.05) ? `<circle cx="450" cy="118" r="${20+45*ratio}" fill="url(#glowG)" opacity="${0.25+0.75*ratio}"/><circle cx="450" cy="118" r="${14+30*ratio}" fill="rgba(255,80,80,${0.25*ratio})"/>` : '';
    const smoke = burn ? `<g fill="#9aa1ad" opacity=".8"><circle cx="442" cy="72" r="7"><animate attributeName="cy" values="80;40" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="458" cy="78" r="9"><animate attributeName="cy" values="84;36" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/></circle></g>` : '';
    const lb = flipped ? 170 : 180, rb = flipped ? 180 : 170;   // left / right leg bottoms
    g.innerHTML = `
      <rect x="20" y="34" width="140" height="180" rx="12" fill="${bc}" stroke="#0b0f1a" stroke-width="2"/>
      <text x="90" y="64" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">${board==='arduino'?'Arduino':'micro:bit'}</text>
      <text x="90" y="82" text-anchor="middle" font-size="11" fill="#cfe">(${Vs} V output pin)</text>
      <rect x="140" y="92" width="24" height="16" rx="3" fill="#d4af37"/><text x="132" y="104" text-anchor="end" font-size="12" font-weight="700" fill="#fff">PIN ${board==='arduino'?'13':'0'}</text>
      <rect x="140" y="184" width="24" height="16" rx="3" fill="#d4af37"/><text x="132" y="196" text-anchor="end" font-size="12" font-weight="700" fill="#fff">GND</text>
      ${wire('M164 100 L230 100')}${wire(`M330 100 L420 100 L420 ${lb} L442 ${lb}`)}${wire(`M458 ${rb} L458 192 L164 192`)}
      <rect x="230" y="88" width="100" height="24" rx="10" fill="#e8d3a9" stroke="#8a6d3b" stroke-width="2"/>
      <rect x="248" y="88" width="9" height="24" fill="${b1}"/><rect x="265" y="88" width="9" height="24" fill="${b2}"/><rect x="282" y="88" width="9" height="24" fill="${b3}"/><rect x="310" y="88" width="7" height="24" fill="#c9a227"/>
      <text x="280" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">Resistor: ${lbl(R)}</text>
      ${glow}${smoke}
      <line x1="442" y1="140" x2="442" y2="${lb}" stroke="#9aa1ad" stroke-width="4"/>
      <line x1="458" y1="140" x2="458" y2="${rb}" stroke="#9aa1ad" stroke-width="4"/>
      <path d="M432 140 L432 112 A18 18 0 0 1 468 112 L468 140 Z" fill="${ledFill}" stroke="#b91c1c" stroke-width="2"/>
      <rect x="428" y="136" width="44" height="6" rx="2" fill="${burn?'#2a1010':'#ff7a7a'}" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="480" y="108" font-size="13" font-weight="700" fill="#172033">LED</text>
      <text x="480" y="124" font-size="11" fill="${flipped?'#c62828':'#5a6679'}" font-weight="${flipped?700:400}">${flipped?'backwards!':'long leg (+)'}</text>
      <text x="480" y="138" font-size="11" fill="${flipped?'#c62828':'#5a6679'}" font-weight="${flipped?700:400}">${flipped?'long leg is on GND':'faces the pin'}</text>
      <text x="350" y="232" text-anchor="middle" font-size="12" fill="#5a6679">Current flows: pin → resistor → LED → GND</text>`;
  }
  function upd(){
    const Vs = board==='arduino' ? 5 : 3;
    const I = flipped ? 0 : Math.max(0, (Vs - Vf)/R);
    const mA = I*1000;
    root.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.b===board));
    picker.querySelectorAll('button').forEach(b=>b.classList.toggle('on', +b.dataset.v===R));
    root.querySelector('.cur').textContent = (Math.round(mA*10)/10) + ' mA';
    draw(mA);
    if(flipped){ st.className='w-status off'; st.innerHTML='The LED is backwards, so <b>no current flows</b>. An LED is a one-way valve: the long leg (+) must face the pin, not GND.'; api.complete('flip'); }
    else if(mA > 20){ st.className='w-status danger'; st.innerHTML=`💥 TOO MUCH CURRENT (${Math.round(mA*10)/10} mA)! A real LED would overheat and burn out. Choose a bigger resistor.`; api.complete('burn'); }
    else if(mA >= 5){ st.className='w-status on'; st.innerHTML=`✅ Safe and bright! ${Math.round(mA*10)/10} mA is under the 20 mA limit.`; api.complete(board==='arduino'?'safeA':'safeM'); }
    else if(mA >= 1){ st.className='w-status warn'; st.innerHTML=`Safe, but dim (${Math.round(mA*10)/10} mA). A slightly smaller resistor would make it brighter.`; }
    else { st.className='w-status warn'; st.innerHTML=`Barely glowing (${Math.round(mA*100)/100} mA). This resistor blocks almost all the current.`; }
  }
  upd();
};

return W;
})();

<script>
/* ============ Activity engine ============
   Data-driven: content lives in window.PARTS, settings in window.ACTIVITY_CONFIG.
   Handles names, saving, section locking, quizzes, remediation and certificates. */
(function(){
'use strict';
const CFG = window.ACTIVITY_CONFIG;
const PARTS = window.PARTS;
const WIDGETS = window.WIDGETS || {};

/* ---------- utilities ---------- */
function el(tag, props){
  const e = document.createElement(tag);
  if(props){ for(const k in props){ const v = props[k];
    if(v==null || v===false) continue;
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k==='text') e.textContent = v;
    else if(k.slice(0,2)==='on' && typeof v==='function') e.addEventListener(k.slice(2), v);
    else if(k==='style') e.style.cssText = v;
    else e.setAttribute(k, v===true ? '' : v);
  }}
  for(let i=2;i<arguments.length;i++) add(e, arguments[i]);
  return e;
}
function add(parent, c){
  if(c==null || c===false) return;
  if(Array.isArray(c)){ c.forEach(x=>add(parent,x)); return; }
  parent.appendChild(typeof c==='string' || typeof c==='number' ? document.createTextNode(String(c)) : c);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){ try{ return new Date(ts).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }catch(e){ return new Date(ts).toDateString(); } }
function wordCount(s){ return (String(s||'').trim().match(/\S+/g)||[]).length; }
function parseNum(str, unit){
  const s = String(str==null?'':str).trim().toLowerCase().replace(/,/g,'');
  const m = s.match(/-?\d*\.?\d+(e-?\d+)?/);
  if(!m) return NaN;
  let v = parseFloat(m[0]);
  const rest = s.slice(m.index + m[0].length).trim();
  if(unit==='A' && /^ma\b|^ma$|^milli/.test(rest)) v = v/1000;
  if(unit==='mA' && /^a$|^amp/.test(rest)) v = v*1000;
  if(unit==='Ω' && /^k/.test(rest)) v = v*1000;
  return v;
}
window.ENGINE_UTILS = { el, shuffle, esc, parseNum };

/* ---------- storage ---------- */
const Store = (function(){
  let ok = false;
  try{ const k='__probe_'+Date.now(); localStorage.setItem(k,'1'); ok = localStorage.getItem(k)==='1'; localStorage.removeItem(k); }catch(e){ ok=false; }
  return {
    ok,
    load(){ if(!ok) return null; try{ const s=localStorage.getItem(CFG.storageKey); return s?JSON.parse(s):null; }catch(e){ return null; } },

function freshPart(){ return { items:{}, done:{}, quiz:{ attempts:[], fails:0, reviews:0, passed:false, best:null }, last:null }; }
function freshState(){ const s={ v:1, student:{first:'',last:'',period:''}, teacher:false, parts:{} }; PARTS.forEach(p=>{ s.parts[p.id]=freshPart(); }); return s; }
function normalize(s){
  if(!s || typeof s!=='object' || s.v!==1) return freshState();
  s.student = Object.assign({first:'',last:'',period:''}, s.student||{});
  s.parts = s.parts || {};
  PARTS.forEach(p=>{ const f = freshPart(); const cur = s.parts[p.id] || {}; s.parts[p.id] = Object.assign(f, cur); s.parts[p.id].quiz = Object.assign(freshPart().quiz, cur.quiz||{}); });

}

function getItem(pid,id){ return PS(pid).items[id]; }
function isItemDone(pid,id){ const it = getItem(pid,id); return !!(it && it.done); }
function putItem(pid,id,obj){ PS(pid).items[id] = Object.assign({}, PS(pid).items[id]||{}, obj); save(); }
function requiredIds(sec){
  const ids=[];
  sec.blocks.forEach(b=>{
    if(b.optional) return;
    if(['mc','num','short','sort','match','record'].includes(b.type)) ids.push(b.id);
    if(b.type==='widget' && b.tasks) b.tasks.forEach(t=>ids.push(b.id+':'+t.id));
  });
  return ids;
}
function sectionReady(pid, sec){ return requiredIds(sec).every(id=>isItemDone(pid,id)); }
function sectionUnlocked(part, idx){ if(S.teacher) return true; if(idx===0) return true; return !!PS(part.id).done[part.sections[idx-1].id]; }
function allSectionsDone(part){ return part.sections.every(s=>PS(part.id).done[s.id]); }
function quizUnlocked(part){ return S.teacher || allSectionsDone(part); }
function certUnlocked(part){ return S.teacher || PS(part.id).quiz.passed; }
function needsReview(part){ const q=PS(part.id).quiz; return !q.passed && q.fails >= CFG.reviewAfterFails; }
function partProgress(part){
  const total = part.sections.length + 1;
  let n = part.sections.filter(s=>PS(part.id).done[s.id]).length + (PS(part.id).quiz.passed?1:0);
  return { n, total, pct: Math.round(100*n/total) };
}

/* ---------- confetti ---------- */
function confetti(){
  const c = el('canvas',{class:'confetti'}); document.body.appendChild(c);
  const ctx = c.getContext('2d'); const W = c.width = innerWidth, H = c.height = innerHeight;
  const colors = ['#ffc53d','#2355d8','#0f9c9a','#e5484d','#7e22ce','#15803d'];
  const ps = Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*200, y:H/3, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:Math.random()*8+4, r:Math.random()*6, c:colors[Math.floor(Math.random()*colors.length)]}));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=0.35; p.x+=p.vx; p.y+=p.vy; p.r+=0.1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t - t0 < 2800) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

function defaultPage(part){
  const last = PS(part.id).last;

  return PS(part.id).quiz.passed ? 'cert' : 'quiz';
}
function pageAllowed(part, page){
  if(page.startsWith('s:')){ const idx = part.sections.findIndex(s=>'s:'+s.id===page); return idx>=0 && sectionUnlocked(part, idx); }
  if(page==='quiz' || page==='review') return quizUnlocked(part);
  if(page==='cert') return certUnlocked(part);
  return false;
}

function qShell(b, labelText){
  const q = el('div',{class:'q'});

  q.appendChild(label);
  if(b.q) q.appendChild(el('div',{class:'q-text', html:b.q}));

  if(b.figure){ fig = el('div',{class:'q-fig', html:b.figure}); q.appendChild(fig); }
  function markDone(){ if(q.classList.contains('is-done')) return; q.classList.add('is-done'); label.appendChild(el('span',{class:'done-tag'},'✓ Done')); if(fig) fig.classList.add('revealed'); }
  return { q, label, fig, markDone };
}
function seededOrder(n, key){
  let h = 2166136261 >>> 0;
  for(let i=0;i<key.length;i++){ h ^= key.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const idx = []; for(let i=0;i<n;i++) idx.push(i);
  for(let i=n-1;i>0;i--){ h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; const j = h % (i+1); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  return idx;
}
function renderMC(b, ctx){
  const sh = qShell(b, b.label || 'Check your understanding');
  const list = el('div',{class:'choices' + (b.choices.length===2 ? ' two':'')});
  const fb = el('div',{class:'feedback', 'aria-live':'polite'});
  let wrong = 0;
  const order = (b.keepOrder || b.choices.length <= 2) ? b.choices.map((_,i)=>i) : seededOrder(b.choices.length, b.id);
  const btns = [];
  order.forEach((i, d)=>{
    const bt = el('button',{type:'button', class:'choice'}, el('span',{class:'cl'}, 'ABCDEFG'[d]), el('span',{html:b.choices[i]}));
    bt.addEventListener('click', ()=>pick(i)); list.appendChild(bt); btns[i] = bt;
  });
  function finish(){
    btns.forEach((bt,j)=>{ bt.disabled = true; if(j===b.answer) bt.classList.add('correct'); });
    sh.markDone(); fb.className = 'feedback ok'; fb.innerHTML = '<b>Correct!</b> ' + (b.explain||'');
  }
  function pick(i){
    if(sh.q.classList.contains('is-done')) return;
    if(i===b.answer){ finish(); putItem(ctx.pid, b.id, {done:true, tries:wrong+1}); ctx.refresh && ctx.refresh(); }
    else { wrong++; btns[i].classList.add('wrong'); btns[i].disabled = true; fb.className='feedback bad'; fb.innerHTML = '<b>Not quite.</b> ' + ((b.why && b.why[i]) || b.hint || 'Think about it again and try another answer.'); }
  }
  sh.q.appendChild(list); sh.q.appendChild(fb);
